apiVersion: v1
kind: Pod
metadata:
  name: test-large-file-volume
spec:
  annotations:
    io.katacontainers.config.hypervisor.default_memory: 5120
  runtimeClassName: kata
  securityContext:
    supplementalGroups: [10]
  restartPolicy: Never
  nodeName: NODE
  volumes:
  - name: shared-file
    hostPath:
      path: HOST_FILE
      type: File
  containers:
  - name: busybox-large-file-volume-container
    image: quay.io/prometheus/busybox:latest
    resources:
    requests:
      memory: 3Gi
    limits:
      memory: 3Gi
    volumeMounts:
    - name: shared-file
      mountPath: MOUNT_PATH
    command: ["/bin/sh"]
    args: ["-c", "tail -f /dev/null"]
