apiVersion: v1
kind: Pod
metadata:
  name: test-pod-hosts
spec:
  runtimeClassName: kata
  restartPolicy: Never
  hostname: hosts-probe
  subdomain: hosts-sub
  hostAliases:
    - ip: "10.99.99.99"
      hostnames:
        - foo.local
        - bar.local
    - ip: "10.99.99.100"
      hostnames:
        - baz.remote
  containers:
  - image: quay.io/prometheus/busybox:latest
    name: pod-hosts-c01
    command: ["cat"]
    args: ["/etc/hosts"]
