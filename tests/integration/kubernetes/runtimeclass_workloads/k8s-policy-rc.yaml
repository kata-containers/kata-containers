apiVersion: v1
kind: ReplicationController
metadata:
  name: policy-rc-test
spec:
  replicas: 1
  selector:
    app: policy-nginx-rc
  template:
    metadata:
      name: nginx
      labels:
        app: policy-nginx-rc
    spec:
      runtimeClassName: kata
      containers:
      - name: nginxtest
        image: ${NGINX_IMAGE}
        ports:
        - name: http
          containerPort: 80
        # Probe ports are IntOrString in the Kubernetes API. Nothing else in
        # this suite hands genpolicy either form, so cover both.
        readinessProbe:
          httpGet:
            path: /
            port: 80
        livenessProbe:
          tcpSocket:
            port: http
        volumeMounts:
          - name: host-empty-vol
            mountPath: "/host/cache"
          - name: host-empty-vol
            mountPath: "/host/cache-read-only"
            readOnly: true
          - mountPath: /tmp/results
            name: hostpath-vol
          - mountPath: /tmp/results-read-only
            name: hostpath-vol-read-only
            readOnly: true
      volumes:
      - name: host-empty-vol
        emptyDir: {}
      - name: hostpath-vol
        hostPath:
          path: /tmp/results
      - name: hostpath-vol-read-only
        hostPath:
          path: /tmp/results-read-only
      preemptionPolicy: PreemptLowerPriority
