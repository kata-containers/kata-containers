apiVersion: v1
kind: Pod
metadata:
  name: ${POD_NAME}
spec:
  # Lets exec_host signal host processes: the PIDs it reads in the host's
  # /proc are only valid in the host PID namespace.
  hostPID: true
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: kubernetes.io/hostname
            operator: In
            values:
            - ${NODE_NAME}
  containers:
  - name: node-debugger-container
    image: quay.io/bedrock/ubuntu:latest
    command: ["/bin/sh", "-c", "sleep infinity"]
    stdin: true
    tty: true
    securityContext:
      privileged: true
      runAsUser: 0
      allowPrivilegeEscalation: true
    volumeMounts:
    - name: host-root
      mountPath: /host
  volumes:
  - name: host-root
    hostPath:
      path: /
      type: Directory
