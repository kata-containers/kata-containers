apiVersion: v1
kind: Pod
metadata:
  name: direct-volume-sparse
spec:
  runtimeClassName: kata
  restartPolicy: Never
  containers:
  - name: test
    image: quay.io/prometheus/busybox:latest
    command: ["sleep", "infinity"]
    volumeMounts:
    - name: direct-volume
      mountPath: /data
  volumes:
  - name: direct-volume
    hostPath:
      path: /tmp/kata-direct-volume-test
      type: Directory
