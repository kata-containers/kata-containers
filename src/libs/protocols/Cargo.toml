[package]
authors = ["The Kata Containers community <kata-dev@lists.katacontainers.io>"]
edition = "2018"
license = "Apache-2.0"
name = "protocols"
version = "0.1.0"

[features]
async = ["async-trait", "ttrpc/async"]
default = []
with-serde = []

[dependencies]
async-trait = { optional = true, workspace = true }
oci-spec = { workspace = true }
protobuf.workspace = true
serde = { features = ["derive"], version = "1.0.130" }
serde_json = "1.0.68"
ttrpc = { features = ["sync"], workspace = true }

[build-dependencies]
protobuf.workspace = true
ttrpc-codegen.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { features = ["macros", "rt-multi-thread"], workspace = true }
