[package]
authors = ["The Kata Containers community <kata-dev@lists.katacontainers.io>"]
description = "System Utilities for Kata Containers"
edition = "2018"
homepage = "https://katacontainers.io/"
keywords = ["container", "kata", "runtime"]
license = "Apache-2.0"
name = "kata-sys-util"
readme = "README.md"
repository = "https://github.com/kata-containers/kata-containers.git"
version = "0.1.0"

[dependencies]
anyhow = "1.0.31"
byteorder = "1.4.3"
fail = "0.5.1"
hex = "0.4.3"
lazy_static = "1.4.0"
libc = "0.2.100"
nix = { features = [
  "fs",
  "ioctl",
  "mount",
  "process",
  "sched",
], workspace = true }
rand = { features = ["std", "std_rng", "thread_rng"], version = "0.10.1" }
serde = { features = ["derive"], version = "1.0.138" }
serde_json = "1.0.73"
slog = "2.5.2"
slog-scope = "4.4.0"
subprocess = "1.2.0"
thiserror = { workspace = true }

kata-types = { path = "../kata-types" }
oci-spec = { workspace = true }
runtime-spec = { path = "../runtime-spec" }

[dev-dependencies]
rstest = { workspace = true }
tempfile = "3.19.1"
test-utils = { path = "../test-utils" }
