      default: Copy

    RestoreConfig:
      required:
        - source_url
      type: object
      properties:
        source_url:
          type: string
        prefault:
          type: boolean
        memory_restore_mode:
          $ref: "#/components/schemas/MemoryRestoreMode"
        resume:
          type: boolean
        zone_updates:
          type: array
          items:
            $ref: "#/components/schemas/VmMemoryZoneUpdateData"

    ReceiveMigrationData:
      required:
        - receiver_url
      type: object
      properties:
        receiver_url:
          type: string
        tls_dir:
          type: string
          description: >
            Directory containing the TLS server certificate (server-cert.pem), the TLS
            server key (server-key.pem), and the client TLS root CA certificate (ca-cert.pem).
            TLS is only supported with tcp:<host>:<port> receiver URLs.
            Recommended for all TCP migrations. Omitting it is only intended for
            development and testing, as TCP migration is then unencrypted and
            unauthenticated.
        zone_updates:
          type: array
          items:
            $ref: "#/components/schemas/VmMemoryZoneUpdateData"
        background_fetch_pages:
          type: boolean
          default: true
          description: Enable the background thread for faulting all remaining pages.

    MigrationMode:
      type: string
      enum: ["MemFDs", "Precopy", "Postcopy"]
      default: "Precopy"
      description: >
        Memory transfer mode. MemFDs passes the guest memory backing file
        descriptors to the destination over a UNIX socket. MemFDs requires every
        guest memory region to use shared memory or hugepage backing. Precopy
        transfers all guest memory before the destination resumes. Postcopy
        resumes the destination first and faults guest pages in on demand.

    VmMemoryZoneUpdateData:
      type: object
      required: [id, host_numa_node]
      properties:
        id:
          type: string
          minLength: 1
        host_numa_node:
          type: integer
          format: uint32
          minimum: 0

    TimeoutStrategy:
      type: string
      enum: ["Cancel", "Ignore"]
      default: "Cancel"
      description: >
        The strategy to apply when the migration timeout is reached.
        Cancel will abort the migration and keep the VM running on the source.
        Ignore will proceed with the migration regardless of the downtime requirement.

    SendMigrationData:
      required:
        - destination_url
      type: object
      properties:
        destination_url:
          type: string
        local:
          type: boolean
          default: false
          deprecated: true
          description: >
            Deprecated: set memory_mode to "MemFDs" instead. If true, the
            request is treated as if memory_mode were "MemFDs".
        preserve_source:
          type: boolean
          default: false
          description: >
            Keep the source VM alive in a paused state after migration
            completes. This is only supported when memory_mode is "MemFDs" or
            the deprecated local property is true.
        downtime_ms:
          type: integer
          format: int64
          minimum: 1
          default: 300
          description: >
            The maximum downtime the migration aims for, in milliseconds.
            Defaults to 300ms.
        timeout_s:
          type: integer
          format: int64
          minimum: 1
          default: 3600
          description: >
            The timeout for the migration (maximum total duration), in seconds.
            Defaults to 3600s (one hour).
        timeout_strategy:
          $ref: "#/components/schemas/TimeoutStrategy"
        connections:
          type: integer
          format: int64
          default: 1
          minimum: 1
          maximum: 128
          description: >
            The number of parallel TCP connections to use for migration.
            Must be between 1 and 128. Multiple connections are not supported
            with UNIX domain socket migration.
        tls_dir:
          type: string
          description: >
            Directory containing the TLS root CA certificate (ca-cert.pem), the TLS client
            certificate (client-cert.pem), and TLS client key (client-key.pem).
            TLS is only supported with tcp:<host>:<port> destination URLs.
            Recommended for all TCP migrations. Omitting it is only intended for
            development and testing, as TCP migration is then unencrypted and
            unauthenticated.
        memory_mode:
          $ref: "#/components/schemas/MigrationMode"

    VmAddUserDevice:
      required:
        - socket
      type: object
      properties:
        socket:
          type: string
        pci_segment:
          type: integer
          format: int16
        pci_device_id:
          type: integer
          format: uint8

    LandlockConfig:
      required:
        - path
        - access
      type: object
      properties:
        path:
          type: string
        access:
          type: string
