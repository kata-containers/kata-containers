openapi: 3.0.1
info:
  title: Cloud Hypervisor API
  description: Local HTTP based API for managing and inspecting a cloud-hypervisor virtual machine.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 0.3.0

servers:
  - url: http://localhost/api/v1

paths:
  /vmm.ping:
    get:
      summary: Ping the VMM to check for API server availability
      responses:
        200:
          description: The VMM information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmmPingResponse"

  /vmm.shutdown:
    put:
      summary: Shuts the cloud-hypervisor VMM.
      operationId: shutdownVMM
      responses:
        204:
          description: The VMM successfully shutdown.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.info:
    get:
      summary: Returns general information about the cloud-hypervisor Virtual Machine (VM) instance.
      responses:
        200:
          description: The VM information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmInfo"
        404:
          description: The VM information is not available because the VM is not created.

  /vm.counters:
    get:
      summary: Get counters from the VM
      responses:
        200:
          description: The VM counters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmCounters"
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.balloon-stats:
    get:
      summary: Get cached statistics from the virtio-balloon device
      responses:
        200:
          description: Most recently reported virtio-balloon statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BalloonStatsResponse"
        409:
          description: The operation conflicts with the current state of the VM.
        500:
          description: The statistics could not be retrieved, e.g. the statistics feature was not negotiated with the guest driver.

  /vm.create:
    put:
      summary: Create the cloud-hypervisor Virtual Machine (VM) instance. The instance is not booted, only created.
      operationId: createVM
      requestBody:
        description: The VM configuration
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmConfig"
        required: true
      responses:
        204:
          description: The VM instance was successfully created.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.delete:
    put:
      summary: Delete the cloud-hypervisor Virtual Machine (VM) instance.
      operationId: deleteVM
      responses:
        204:
          description: The VM instance was successfully deleted.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.boot:
    put:
      summary: Boot the previously created VM instance.
      operationId: bootVM
      responses:
        204:
          description: The VM instance successfully booted.
        404:
          description: The VM instance could not boot because it is not created yet
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.pause:
    put:
      summary: Pause a previously booted VM instance.
      operationId: pauseVM
      responses:
        204:
          description: The VM instance successfully paused.
        404:
          description: The VM instance could not pause because it is not created yet
        405:
          description: The VM instance could not pause because it is not booted.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.resume:
    put:
      summary: Resume a previously paused VM instance.
      operationId: resumeVM
      responses:
        204:
          description: The VM instance successfully paused.
        404:
          description: The VM instance could not resume because it is not booted yet
        405:
          description: The VM instance could not resume because it is not paused.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.shutdown:
    put:
      summary: Shut the VM instance down.
      operationId: shutdownVM
      responses:
        204:
          description: The VM instance successfully shut down.
        404:
          description: The VM instance could not shut down because is not created.
        405:
          description: The VM instance could not shut down because it is not started.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.reboot:
    put:
      summary: Reboot the VM instance.
      operationId: rebootVM
      responses:
        204:
          description: The VM instance successfully rebooted.
        404:
          description: The VM instance could not reboot because it is not created.
        405:
          description: The VM instance could not reboot because it is not booted.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.power-button:
    put:
      summary: Trigger a power button in the VM
      operationId: power-buttonVM
      responses:
        204:
          description: Power button successfully triggered in the VM
        404:
          description: The button could not be triggered because it is not created yet
        405:
          description: The button could not be triggered because it is not booted.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.resize:
    put:
      summary: Resize the VM
      requestBody:
        description: The target size for the VM
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmResize"
        required: true
      responses:
        204:
          description: The VM instance was successfully resized.
        404:
          description: The VM instance could not be resized because it is not created.
        409:
          description: The operation conflicts with the current state of the VM.
        429:
          description: The VM instance could not be resized because a cpu removal is still pending.

  /vm.resize-disk:
    put:
      summary: Resize a disk
      requestBody:
        description: Resizes a disk attached to the VM
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmResizeDisk"
        required: true
      responses:
        204:
          description: The disk was successfully resized.
        404:
          description: The disk could not be resized because the VM is not created, or no disk with the given identifier exists.
        409:
          description: The operation conflicts with the current state of the VM.
        500:
          description: The disk could not be resized.

  /vm.resize-zone:
    put:
      summary: Resize a memory zone
      requestBody:
        description: The target size for the memory zone
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmResizeZone"
        required: true
      responses:
        204:
          description: The memory zone was successfully resized.
        404:
          description: The memory zone could not be resized because the VM is not created.
        409:
          description: The operation conflicts with the current state of the VM.
        500:
          description: The memory zone could not be resized.

  /vm.add-device:
    put:
      summary: Add a new device to the VM
      requestBody:
        description: The path of the new device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceConfig"
        required: true
      responses:
        200:
          description: The new device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new device was successfully (cold) added to the VM instance.
        400:
          description: The new device could not be added because the configuration is not valid.
        404:
          description: The new device could not be added to the VM instance.
        409:
          description: The new device could not be added because a device with the same identifier or path already exists, or because the operation conflicts with the current state of the VM.

  /vm.remove-device:
    put:
      summary: Remove a device from the VM
      requestBody:
        description: The identifier of the device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmRemoveDevice"
        required: true
      responses:
        204:
          description: The device was successfully removed from the VM instance.
        404:
          description: The device could not be removed because the VM is not created, or no device with the given identifier exists.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.add-disk:
    put:
      summary: Add a new disk to the VM
      requestBody:
        description: The details of the new disk
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiskConfig"
        required: true
      responses:
        200:
          description: The new disk was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new disk was successfully (cold) added to the VM instance.
        400:
          description: The new disk could not be added because the configuration is not valid.
        404:
          description: The new disk could not be added because the VM is not created.
        409:
          description: The new disk could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new disk could not be added to the VM instance.

  /vm.add-fs:
    put:
      summary: Add a new virtio-fs device to the VM
      requestBody:
        description: The details of the new virtio-fs
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FsConfig"
        required: true
      responses:
        200:
          description: The new device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new device was successfully (cold) added to the VM instance.
        400:
          description: The new device could not be added because the configuration is not valid.
        404:
          description: The new device could not be added because the VM is not created.
        409:
          description: The new device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new device could not be added to the VM instance.

  /vm.add-generic-vhost-user:
    put:
      summary: Add a new generic vhost-user device to the VM
      requestBody:
        description: The details of the new generic vhost-user device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenericVhostUserConfig"
        required: true
      responses:
        200:
          description: The new device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new device was successfully (cold) added to the VM instance.
        400:
          description: The new device could not be added because the configuration is not valid.
        404:
          description: The new device could not be added because the VM is not created.
        409:
          description: The new device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new device could not be added to the VM instance.

  /vm.add-pmem:
    put:
      summary: Add a new pmem device to the VM
      requestBody:
        description: The details of the new pmem device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PmemConfig"
        required: true
      responses:
        200:
          description: The new device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new device was successfully (cold) added to the VM instance.
        400:
          description: The new device could not be added because the configuration is not valid.
        404:
          description: The new device could not be added because the VM is not created.
        409:
          description: The new device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new device could not be added to the VM instance.

  /vm.add-net:
    put:
      summary: Add a new network device to the VM
      requestBody:
        description: The details of the new network device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetConfig"
        required: true
      responses:
        200:
          description: The new device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new device was successfully (cold) added to the VM instance.
        400:
          description: The new device could not be added because the configuration is not valid.
        404:
          description: The new device could not be added because the VM is not created.
        409:
          description: The new device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new device could not be added to the VM instance.

  /vm.add-vsock:
    put:
      summary: Add a new vsock device to the VM
      requestBody:
        description: The details of the new vsock device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VsockConfig"
        required: true
      responses:
        200:
          description: The new device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new device was successfully (cold) added to the VM instance.
        400:
          description: The new device could not be added because the configuration is not valid.
        404:
          description: The new device could not be added because the VM is not created.
        409:
          description: The new device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new device could not be added to the VM instance.

  /vm.add-vdpa:
    put:
      summary: Add a new vDPA device to the VM
      requestBody:
        description: The details of the new vDPA device
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VdpaConfig"
        required: true
      responses:
        200:
          description: The new vDPA device was successfully added to the VM instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PciDeviceInfo"
        204:
          description: The new vDPA device was successfully (cold) added to the VM instance.
        400:
          description: The new vDPA device could not be added because the configuration is not valid.
        404:
          description: The new vDPA device could not be added because the VM is not created.
        409:
          description: The new vDPA device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        500:
          description: The new vDPA device could not be added to the VM instance.

  /vm.add-user-device:
    put:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VmAddUserDevice'
        description: The path of the new device
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PciDeviceInfo'
          description: The new device was successfully added to the VM instance.
        "204":
          description: The new device was successfully (cold) added to the VM instance.
        "400":
          description: The new device could not be added because the configuration is not valid.
        "409":
          description: The new device could not be added because a device with the same identifier already exists, or because the operation conflicts with the current state of the VM.
        "404":
          description: The new device could not be added to the VM instance.
      summary: Add a new userspace device to the VM

  /vm.snapshot:
    put:
      summary: Returns a VM snapshot.
      requestBody:
        description: The snapshot configuration
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmSnapshotConfig"
        required: true
      responses:
        204:
          description: The VM instance was successfully snapshotted.
        404:
          description: The VM instance could not be snapshotted because it is not created.
        405:
          description: The VM instance could not be snapshotted because it is not booted.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.coredump:
    put:
      summary: Takes a VM coredump.
      requestBody:
        description: The coredump configuration
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmCoredumpData"
        required: true
      responses:
        204:
          description: The VM instance was successfully coredumped.
        404:
          description: The VM instance could not be coredumped because it is not created.
        405:
          description: The VM instance could not be coredumped because it is not booted.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.nmi:
    put:
      summary: Inject an NMI.
      responses:
        204:
          description: The NMI successfully injected.
        409:
          description: The operation conflicts with the current state of the VM.

  /vm.restore:
    put:
      summary: Restore a VM from a snapshot.
      requestBody:
        description: The restore configuration
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreConfig"
        required: true
      responses:
        204:
          description: The VM instance was successfully restored.
        400:
          description: The VM could not be restored because the restore configuration is not valid.
        404:
          description: The VM instance could not be restored because it is already created.
        409:
          description: The VM could not be restored because a device with the same identifier or path already exists, or because the operation conflicts with the current state of the VM.

  /vm.receive-migration:
    put:
      summary: Receive a VM migration from URL
      requestBody:
        description: The URL for the reception of migration state
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReceiveMigrationData"
        required: true
      responses:
        204:
          description: The VM migration was successfully received.
        409:
          description: The operation conflicts with the current state of the VMM.
        500:
          description: The VM migration could not be received.

  /vm.send-migration:
    put:
      summary: Send a VM migration to URL
      requestBody:
        description: The URL for sending the migration state
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMigrationData"
        required: true
      responses:
        204:
          description: The VM migration was successfully sent.
        409:
          description: The operation conflicts with the current state of the VMM.
        500:
          description: The VM migration could not be sent.

  /vm.cancel-migration:
    put:
      summary: Cancel an ongoing VM migration
      description: >
        Requests the cancellation of an ongoing migration on a best effort
        basis. A successful response only indicates that the request was
        accepted, not that the migration was actually cancelled: The migration
        may have progressed too far to be stopped. The actual outcome must be
        observed externally via the event monitor.
      responses:
        204:
          description: The cancellation request was successfully submitted.
        500:
          description: The cancellation request could not be submitted because there is no ongoing migration.

components:
  schemas:
    VmmPingResponse:
      required:
        - version
      type: object
      properties:
        build_version:
          type: string
        version:
          type: string
        pid:
          type: integer
          format: int64
        features:
          type: array
          items:
            type: string
      description: Virtual Machine Monitor information

    VmState:
      type: string
      enum: [Created, Running, Shutdown, Paused, BreakPoint]

    VmInfo:
      required:
        - config
        - state
      type: object
      properties:
        config:
          $ref: "#/components/schemas/VmConfig"
        state:
          $ref: "#/components/schemas/VmState"

        memory_actual_size:
          type: integer
          format: int64
        device_tree:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/DeviceNode"
      description: Virtual Machine information

    DeviceNode:
      type: object
      properties:
        id:
          type: string
        resources:
          type: array
          items:
            # Rust enum type (with data) which can't be better represented here
            type: object
        children:
          type: array
          items:
            type: string
        pci_bdf:
          type: string

    VmCounters:
      type: object
      additionalProperties:
        type: object
        additionalProperties:
          type: integer
          format: int64

    BalloonStatsResponse:
      required:
        - balloon_actual
        - last_update
        - stats
      type: object
      properties:
        balloon_actual:
          type: integer
          format: int64
          description: Current balloon size in bytes
        last_update:
          type: integer
          format: int64
          description: Host UNIX timestamp in milliseconds when statistics were last updated, or zero before the first sample
        stats:
          $ref: "#/components/schemas/BalloonStats"

    BalloonStats:
      type: object
      properties:
        swap_in:
          type: integer
          format: int64
          description: Memory swapped into the guest in bytes
        swap_out:
          type: integer
          format: int64
          description: Memory swapped out by the guest in bytes
        major_faults:
          type: integer
          format: int64
          description: Number of major page faults
        minor_faults:
          type: integer
          format: int64
          description: Number of minor page faults
        free_memory:
          type: integer
          format: int64
          description: Unused guest memory in bytes
        total_memory:
          type: integer
          format: int64
          description: Total guest memory in bytes
        available_memory:
          type: integer
          format: int64
          description: Guest memory available without swapping in bytes
        disk_caches:
          type: integer
          format: int64
          description: Reclaimable guest disk caches in bytes
        hugetlb_allocations:
          type: integer
          format: int64
          description: Number of successful hugetlb allocations
        hugetlb_failures:
          type: integer
          format: int64
          description: Number of failed hugetlb allocations
        oom_kills:
          type: integer
          format: int64
          description: Number of guest OOM kills reported by Linux
        alloc_stalls:
          type: integer
          format: int64
          description: Number of guest memory allocation stalls reported by Linux
        async_scans:
          type: integer
          format: int64
          description: Memory scanned asynchronously by Linux in bytes
        direct_scans:
          type: integer
          format: int64
          description: Memory scanned directly by Linux in bytes
        async_reclaims:
          type: integer
          format: int64
          description: Memory reclaimed asynchronously by Linux in bytes
        direct_reclaims:
          type: integer
          format: int64
          description: Memory reclaimed directly by Linux in bytes

    PciDeviceInfo:
      required:
        - id
        - bdf
      type: object
      properties:
        id:
          type: string
        bdf:
          type: string
      description: Information about a PCI device

    PayloadConfig:
      type: object
      properties:
        firmware:
          type: string
        kernel:
          type: string
        cmdline:
          type: string
        initramfs:
          type: string
        igvm:
          type: string
        host_data:
          type: string
      description: Payloads to boot in guest

    VmConfig:
      required:
        - payload
      type: object
      properties:
        cpus:
          $ref: "#/components/schemas/CpusConfig"
        memory:
          $ref: "#/components/schemas/MemoryConfig"
        payload:
          $ref: "#/components/schemas/PayloadConfig"
        rate_limit_groups:
          type: array
          items:
            $ref: "#/components/schemas/RateLimitGroupConfig"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/DiskConfig"
        net:
          type: array
          items:
            $ref: "#/components/schemas/NetConfig"
        rng:
          $ref: "#/components/schemas/RngConfig"
        balloon:
          $ref: "#/components/schemas/BalloonConfig"
        fs:
          type: array
          items:
            $ref: "#/components/schemas/FsConfig"
        generic_vhost_user:
          type: array
          items:
            $ref: "#/components/schemas/GenericVhostUserConfig"
        pmem:
          type: array
          items:
            $ref: "#/components/schemas/PmemConfig"
        serial:
          $ref: "#/components/schemas/SerialConfig"
        console:
          $ref: "#/components/schemas/ConsoleConfig"
        debug_console:
          $ref: "#/components/schemas/DebugConsoleConfig"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/DeviceConfig"
        user_devices:
          type: array
          items:
            $ref: '#/components/schemas/UserDeviceConfig'
        vdpa:
          type: array
          items:
            $ref: "#/components/schemas/VdpaConfig"
        vsock:
          $ref: "#/components/schemas/VsockConfig"
        numa:
          type: array
          items:
            $ref: "#/components/schemas/NumaConfig"
        watchdog:
          type: boolean
          default: false
        rtc:
          $ref: "#/components/schemas/RtcConfig"
        pvpanic:
          type: boolean
          default: false
        pci_segments:
          type: array
          items:
            $ref: "#/components/schemas/PciSegmentConfig"
        platform:
          $ref: "#/components/schemas/PlatformConfig"
        tpm:
          $ref: "#/components/schemas/TpmConfig"
        landlock_enable:
          type: boolean
          default: false
        landlock_rules:
          type: array
          items:
            $ref: "#/components/schemas/LandlockConfig"
      description: Virtual machine configuration

    CpuAffinity:
      required:
        - vcpu
        - host_cpus
      type: object
      properties:
        vcpu:
          type: integer
        host_cpus:
          type: array
          items:
            type: integer

    CpuFeatures:
      type: object
      properties:
        amx:
          type: boolean

    CpuTopology:
      type: object
      properties:
        threads_per_core:
          type: integer
        cores_per_die:
          type: integer
        dies_per_package:
          type: integer
        packages:
          type: integer

    CoreSchedulingMode:
      type: string
      enum: ["Vm", "Vcpu", "Off"]
      default: "Vm"

    CpusConfig:
      required:
        - boot_vcpus
        - max_vcpus
      type: object
      properties:
        boot_vcpus:
          minimum: 1
          type: integer
