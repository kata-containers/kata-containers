[package]
authors = { workspace = true }
description = "Containerd shim runtime for Kata Containers"
edition = { workspace = true }
keywords = ["kata-containers", "shim"]
license = { workspace = true }
name = "shim"
repository = "https://github.com/kata-containers/kata-containers.git"
version = "0.1.0"

[[bin]]
name = "containerd-shim-kata-v2"
path = "src/bin/main.rs"

[dependencies]
anyhow = { workspace = true }
backtrace = { default-features = false, features = [
  "libunwind",
  "std",
], version = ">=0.3.76" }
containerd-shim-protos = { workspace = true }
go-flag = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
nix = { workspace = true }
oci-spec = { workspace = true }
protobuf = { workspace = true }
sha2 = { workspace = true }
slog = { features = [
  "max_level_trace",
  "release_max_level_trace",
  "std",
], workspace = true }
slog-async = "2.5.2"
slog-scope = { workspace = true }
slog-stdlog = "4.1.0"
thiserror = { workspace = true }
tokio = { features = ["rt", "rt-multi-thread"], workspace = true }
unix_socket2 = "0.5.4"

# Local dependencies
kata-sys-util = { workspace = true }
kata-types = { workspace = true }
logging = { workspace = true }
runtime-spec = { workspace = true }
service = { workspace = true }

[dev-dependencies]
serial_test = "0.10.0"
tempfile = { workspace = true }
