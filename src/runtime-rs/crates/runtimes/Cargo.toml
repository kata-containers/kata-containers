[package]
authors = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
name = "runtimes"
version = "0.1.0"

[dev-dependencies]
rstest = { workspace = true }
tempfile = { workspace = true }

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
containerd-shim-protos = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
lazy_static = { workspace = true }
netns-rs = { workspace = true }
nix = { workspace = true }
oci-spec = { workspace = true }
opentelemetry = { default-features = false, features = [
  "trace",
], version = "0.32.0" }
opentelemetry-otlp = { default-features = false, features = [
  "grpc-tonic",
  "internal-logs",
  "tls-ring",
  "tls-roots",
  "trace",
], version = "0.32.0" }
opentelemetry_sdk = { default-features = false, features = [
  "trace",
], version = "0.32.1" }
procfs = "0.12.0"
prometheus = { features = ["process"], version = "0.14.0" }
serde_json = { workspace = true }
slog = { workspace = true }
slog-scope = { workspace = true }
tokio = { features = ["rt-multi-thread"], workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { default-features = false, version = "0.33.0" }
tracing-subscriber = { features = ["registry", "std"], version = "0.3" }
url = { workspace = true }

# Local dependencies
agent = { workspace = true }
common = { workspace = true }
hypervisor = { workspace = true }
kata-sys-util = { workspace = true }
kata-types = { workspace = true }
logging = { workspace = true }
persist = { workspace = true }
protobuf = { workspace = true }
protocols = { workspace = true }
resource = { workspace = true }
runtime-spec = { workspace = true }
shim-interface = { workspace = true }

# Local dependencies: runtime handler
linux_container = { optional = true, workspace = true }
virt_container = { optional = true, workspace = true }
wasm_container = { optional = true, workspace = true }

[features]
default = ["virt"]
linux = ["linux_container"]
virt = ["virt_container"]
wasm = ["wasm_container"]

cloud-hypervisor = ["virt_container/cloud-hypervisor"]
dragonball = ["virt_container/dragonball"]
openvmm = ["virt_container/openvmm"]
