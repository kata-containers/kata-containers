[dependencies]
actix-rt = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
crossbeam-channel = "0.5.6"
futures = "0.3.25"
go-flag = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
lazy_static = { workspace = true }
libc = { workspace = true }
nix = { workspace = true }
once_cell = "1.21.3"
path-clean = "1.0.1"
pcilibs-rs = { workspace = true }
protobuf = { optional = true, workspace = true }
qapi = { features = ["async-tokio-all", "qmp"], version = "0.15" }
qapi-qmp = "0.15.0"
qapi-spec = "0.3.2"
rand = { workspace = true }
regex = "1"
rust-ini = "0.18.0"
seccompiler = "0.5.0"
serde = { workspace = true }
serde_json = { workspace = true }
slog = { workspace = true }
slog-scope = { workspace = true }
thiserror = { workspace = true }
tokio = { features = ["fs", "io-util", "process", "sync"], workspace = true }
tracing = { workspace = true }
ttrpc = { features = ["async"], workspace = true }
vmm-sys-util = "0.15.0"
# Local dependencies
ch-config = { optional = true, workspace = true }
kata-sys-util = { workspace = true }
kata-types = { workspace = true }
logging = { workspace = true }
persist = { workspace = true }
protocols = { features = ["async"], workspace = true }
safe-path = { workspace = true }
tempfile = { workspace = true }
tests_utils = { workspace = true }

# Dependencies that only exist to support hypervisors which upstream only
# build on x86_64 and aarch64 (dragonball, firecracker). Keeping them in a
# target-specific table means:
#   * the `dragonball` cargo feature is a safe no-op on s390x/ppc64le/
#     riscv64gc (so `cargo clippy --all-features` in CI doesn't break),
#   * the dep graph on those targets is completely free of dragonball
#     and firecracker artifacts, matching what the Makefile already
#     installs (`FCCMD` is only defined for x86_64/aarch64), and
#   * any future `use dbs_utils::...` or `use hyperlocal::...` in code
#     that isn't already arch-gated will fail to build on those targets,
#     forcing the new code to grow a proper `cfg(target_arch = ...)`
#     gate at review time instead of silently shipping dead code.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
# `dbs-utils` is only used by the dragonball and firecracker drivers
# (both x86_64+aarch64 only). It compiles on every arch, but we have no
# use for it elsewhere, so don't pull it in.
dbs-utils = { workspace = true }
# `hyperlocal` is only used by the firecracker driver (UDS HTTP client).
dragonball = { features = [
  "atomic-guest-memory",
  "dbs-upcall",
  "host-device",
  "hotplug",
  "vhost-net",
  "vhost-user-net",
  "virtio-balloon",
  "virtio-blk",
  "virtio-fs",
  "virtio-mem",
  "virtio-net",
  "virtio-vsock",
], optional = true, workspace = true }
hyperlocal = { workspace = true }

[features]
default = ["cloud-hypervisor"]

cloud-hypervisor = ["ch-config"]
dragonball = ["dep:dragonball"]
openvmm = ["dep:protobuf"]

[dev-dependencies]
rstest = { workspace = true }
serial_test = "2.0.0"

# Local dev-dependencies
hypervisor = { workspace = true }
test-utils = { workspace = true }

[build-dependencies]
ttrpc-codegen = "0.6.0"

[lints.rust]
unexpected_cfgs = { check-cfg = [
  'cfg(feature, values("enable-vendor"))',
], level = "warn" }
