[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "kata-agent-ctl"
version = "0.0.1"

[dependencies]
oci-spec.workspace = true
protocols = { features = ["with-serde"], workspace = true }

anyhow.workspace = true
byteorder = "1.3.4"
clap = { features = ["cargo", "derive"], workspace = true }
hex = "0.4.2"
lazy_static.workspace = true

# Note: this crate sets the slog 'max_*' features which allows the log level
# to be modified at runtime.
logging.workspace = true
protobuf.workspace = true
rand.workspace = true
slog.workspace = true
slog-scope.workspace = true

libc.workspace = true
nix.workspace = true
# XXX: Must be the same as the version used by the agent
ttrpc.workspace = true

# For parsing timeouts
humantime = "2.1.0"

# For Options (state passing)
serde.workspace = true
serde_json.workspace = true

kata-types.workspace = true

# hypervisor crate from runtime-rs
hypervisor.workspace = true
kata-sys-util.workspace = true
safe-path.workspace = true

tokio.workspace = true

[features]
default = ["cloud-hypervisor"]

# Enable the Cloud Hypervisor driver
cloud-hypervisor = []
