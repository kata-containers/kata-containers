[package]
authors.workspace = true
edition.workspace = true
license.workspace = true
name = "kata-trace-forwarder"
version = "0.0.1"

[dependencies]
anyhow.workspace = true
byteorder = "1.4.3"
clap = { features = ["cargo"], workspace = true }
libc.workspace = true
nix = { features = ["fs", "signal", "user"], version = "0.30.1" }
opentelemetry = { features = ["serialize"], workspace = true }
opentelemetry-otlp = { features = ["grpc-tonic", "trace"], version = "0.32.0" }
opentelemetry-otlp-api = { features = [
  "trace",
], package = "opentelemetry", version = "0.32.0" }
opentelemetry_sdk = { features = ["rt-tokio"], version = "0.32.1" }
serde_json = { features = ["arbitrary_precision"], workspace = true }
tokio = { features = [
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
], version = "1" }
tokio-vsock.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Note: this crate sets the slog 'max_*' features which allows the log level
# to be modified at runtime.
logging.workspace = true
slog.workspace = true

privdrop = "0.5.1"

[dev-dependencies]
tempfile.workspace = true
