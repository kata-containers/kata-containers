apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: directvolume.csi.katacontainers.io
  labels:
    app.kubernetes.io/instance: directvolume.csi.katacontainers.io
    app.kubernetes.io/part-of: csi-driver-kata-directvolume
    app.kubernetes.io/name: directvolume.csi.katacontainers.io
    app.kubernetes.io/component: csi-driver
spec:
  # Supports persistent volume.
  volumeLifecycleModes:
  - Persistent
  # To determine at runtime which mode a volume uses, pod info.
  podInfoOnMount: true
  # No attacher needed.
  attachRequired: false
  # The csi-provisioner sidecars publish the capacity of every node as
  # CSIStorageCapacity objects. For each unbound WaitForFirstConsumer volume
  # of a pod, the scheduler then skips nodes which do not report enough of
  # it. The capacity is not reserved: when two volumes race for the same
  # space, CreateVolume rejects one with RESOURCE_EXHAUSTED and the pod is
  # scheduled again.
  # directvol-deploy.sh removes this line if the cluster has no
  # CSIStorageCapacity v1 API (Kubernetes < 1.24).
  storageCapacity: true
  # Kubernetes may use fsGroup to change permissions and ownership
  # of the volume to match user requested fsGroup in the pod's SecurityPolicy
  fsGroupPolicy: File
