# Supplement the external-provisioner RBAC with capacity publication and
# DaemonSet ownership traversal (the upstream Role covers ReplicaSets).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: csi-directvol-capacity
  namespace: kata-directvolume
rules:
  - apiGroups: [storage.k8s.io]
    resources: [csistoragecapacities]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get]
  - apiGroups: [apps]
    resources: [daemonsets]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: csi-directvol-capacity
  namespace: kata-directvolume
subjects:
  - kind: ServiceAccount
    name: csi-provisioner
    namespace: kata-directvolume
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: csi-directvol-capacity
