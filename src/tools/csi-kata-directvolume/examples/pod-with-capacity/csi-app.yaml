kind: Pod
apiVersion: v1
metadata:
  name: kata-directvol-capacity-01
spec:
  runtimeClassName: kata
  containers:
    - name: first-container
      image: ubuntu:22.04
      volumeMounts:
      - mountPath: "/data"
        name: kata-directvol-capacity-volume
      command: [ "sleep", "1000000" ]
  volumes:
    - name: kata-directvol-capacity-volume
      persistentVolumeClaim:
        claimName: csi-directvolume-capacity-pvc # defined in csi-pvc.yaml
