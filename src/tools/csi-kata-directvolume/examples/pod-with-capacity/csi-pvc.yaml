kind: PersistentVolumeClaim
metadata:
  name: csi-directvolume-capacity-pvc
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 4Gi
  storageClassName: csi-kata-directvolume-capacity-sc # defined in csi-storageclass.yaml
