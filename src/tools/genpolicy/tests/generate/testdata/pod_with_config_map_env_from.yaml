---
apiVersion: v1
kind: Pod
metadata:
  name: one-container-config-map-env-from
  labels:
    run: busybox
spec:
  restartPolicy: Never
  runtimeClassName: kata-cc
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 10
  containers:
    - name: busybox
      image: "quay.io/prometheus/busybox:latest"
      stdin: true
      envFrom:
        - configMapRef:
            name: configmap-sample
      securityContext:
        privileged: true
      command:
        - /bin/sh
      args:
        - "-c"
        - while true; do echo hello; sleep 10; done
