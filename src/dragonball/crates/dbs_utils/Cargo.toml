[package]
authors = ["Alibaba Dragonball Team"]
description = "helpers and utilities used by dragonball-sandbox components"
edition = "2018"
homepage = "https://github.com/openanolis/dragonball-sandbox"
keywords = ["dragonball", "secure-sandbox", "utils"]
license = "Apache-2.0 AND BSD-3-Clause"
name = "dbs-utils"
readme = "README.md"
repository = "https://github.com/openanolis/dragonball-sandbox"
version = "0.2.1"

[dependencies]
anyhow = { workspace = true }
event-manager = { features = ["remote_endpoint"], workspace = true }
libc = { workspace = true }
log = { workspace = true }
serde = { features = ["derive", "rc"], workspace = true }
thiserror = { workspace = true }
timerfd = { workspace = true }
vmm-sys-util = { workspace = true }

[dev-dependencies]
nix = { workspace = true }
serde_json = { workspace = true }
test-utils = { workspace = true }
