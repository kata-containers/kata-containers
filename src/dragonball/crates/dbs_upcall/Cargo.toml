[package]
authors = ["Alibaba Dragonball Team"]
description = "dbs-upcall is a direct communication tool between VMM and guest"
edition = "2018"
homepage = "https://github.com/openanolis/dragonball-sandbox"
keywords = ["devices", "dragonball", "secure-sandbox", "upcall", "virtio"]
license = "Apache-2.0"
name = "dbs-upcall"
readme = "README.md"
repository = "https://github.com/openanolis/dragonball-sandbox/tree/main/crates/dbs-virtio-devices"
version = "0.3.0"

[dependencies]
log = { workspace = true }
thiserror = { workspace = true }
timerfd = { workspace = true }

dbs-utils = { workspace = true }
dbs-virtio-devices = { features = ["virtio-vsock"], workspace = true }
