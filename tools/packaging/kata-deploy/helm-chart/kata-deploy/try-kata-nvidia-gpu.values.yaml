# Example values file to enable NVIDIA GPU shims
# This includes all NVIDIA GPU-enabled shims: qemu-nvidia-gpu, qemu-nvidia-gpu-runtime-rs, qemu-nvidia-gpu-snp, qemu-nvidia-gpu-snp-runtime-rs, qemu-nvidia-gpu-tdx, qemu-nvidia-gpu-tdx-runtime-rs
#
# Usage:
#   helm install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version VERSION \
#     -f try-kata-nvidia-gpu.values.yaml

debug: false

# Install Kata via short-lived per-node Jobs instead of an always-on DaemonSet.
# A tiny dispatcher Job fans out one install Job per selected node and exits, so
# nothing keeps running on the node once the install completes.
deploymentMode: job

snapshotter:
  setup: ["nydus", "erofs"]
  # The NVIDIA GPU runtime-rs handler runs with shared_fs=none and uses the
  # EROFS snapshotter with memory-backed rw layers and dm-verity for lower
  # (image) layer integrity. TEE handlers keep nydus/guest-pull separately.
  # Nodes upgrading from an earlier profile must recreate cached EROFS layers
  # that do not contain dm-verity metadata.
  erofsSnapshotterMode: "memory"
  erofsDmverity: true

# EROFS fs-verity requires the backing filesystem to support fs-verity, and we
# cannot guarantee that on an arbitrary node. Rather than gate this profile on a
# host feature we do not control, we disable fs-verity so it works on the widest
# possible range of setups; we take that hit deliberately to keep the profile
# generic. Ship this as the default containerd erofs snapshotter drop-in for the
# NVIDIA GPU runtime-rs handler so it does not need to be injected out-of-band.
# It is loaded after kata-deploy's generated config, so it overrides the
# built-in enable_fsverity default.
#
# NOTE: This drop-in targets containerd's built-in EROFS snapshotter, which is
# only available on containerd >= 2.2.0 (config version 3, using the
# auto-imported conf.d drop-in mechanism). This is the same minimum kata-deploy
# enforces for the EROFS snapshotter.
containerd:
  userDropIn: |
    [plugins.'io.containerd.snapshotter.v1.erofs']
      enable_fsverity = false

# Enable NVIDIA GPU shims
# Disable all shims at once, then enable only the ones we need
shims:
  disableAll: true

  # Enable NVIDIA GPU shims
  qemu-nvidia-gpu:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""
    runtimeClass:
      # Published by this chart's NVIDIA GPU NodeFeatureRule, so no GPU Operator
      # is needed to find a GPU node. Select on the GPU Operator's
      # `nvidia.com/cc.ready.state: "false"` instead to keep this class off the
      # nodes your confidential workloads use.
      nodeSelector:
        nvidia.feature.node.kubernetes.io/gpu: "true"

  qemu-nvidia-gpu-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "erofs"
    runtimeClass:
      # See qemu-nvidia-gpu above.
      nodeSelector:
        nvidia.feature.node.kubernetes.io/gpu: "true"

  qemu-nvidia-gpu-snp:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""
    runtimeClass:
      # These labels are automatically added by gpu-operator and NFD
      # respectively. Override if you want to use a different label.
      # If you don't have NFD, you need to add the snp label by other
      # means to your SNP nodes.
      nodeSelector:
        nvidia.com/cc.ready.state: "true"
        amd.feature.node.kubernetes.io/snp: "true"

  qemu-nvidia-gpu-snp-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""
    runtimeClass:
      # These labels are automatically added by gpu-operator and NFD
      # respectively. Override if you want to use a different label.
      # If you don't have NFD, you need to add the snp label by other
      # means to your SNP nodes.
      nodeSelector:
        nvidia.com/cc.ready.state: "true"
        amd.feature.node.kubernetes.io/snp: "true"

  qemu-nvidia-gpu-tdx:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""
    runtimeClass:
      # These labels are automatically added by gpu-operator and NFD
      # respectively. Override if you want to use a different label.
      # If you don't have NFD, you need to add the tdx label by other
      # means to your TDX nodes.
      nodeSelector:
        nvidia.com/cc.ready.state: "true"
        intel.feature.node.kubernetes.io/tdx: "true"

  qemu-nvidia-gpu-tdx-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "nydus"
      forceGuestPull: false
    crio:
      guestPull: true
    agent:
      httpsProxy: ""
      noProxy: ""
    runtimeClass:
      # These labels are automatically added by gpu-operator and NFD
      # respectively. Override if you want to use a different label.
      # If you don't have NFD, you need to add the tdx label by other
      # means to your TDX nodes.
      nodeSelector:
        nvidia.com/cc.ready.state: "true"
        intel.feature.node.kubernetes.io/tdx: "true"

# Default shim per architecture (prefer NVIDIA GPU shims)
defaultShim:
  amd64: qemu-nvidia-gpu  # Can be changed to qemu-nvidia-gpu-snp or qemu-nvidia-gpu-tdx if preferred

runtimeClasses:
  enabled: true
  createDefault: false
  defaultName: "kata"
