# Firecracker with the Rust shim and configuration-rs-fc.toml.
# Configure a containerd devmapper thin-pool on each node before installing.
# See docs/how-to/how-to-use-kata-containers-with-firecracker.md.

debug: false

snapshotter:
  setup: []

shims:
  disableAll: true
  rs-fc:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    # Keep emptyDir writes visible to kubelet without filesystem sharing.
    dropIn: |
      [runtime]
      emptydir_mode = "block-plain"
    containerd:
      snapshotter: devmapper

defaultShim:
  amd64: rs-fc

runtimeClasses:
  enabled: true
  createDefault: false
  defaultName: kata
