# Example values file to enable the Firecracker runtime-rs shim (fc-runtime-rs)
#
# Firecracker does not implement filesystem sharing, so a container's image has
# to reach the guest as a block device: containerd's devmapper snapshotter.
#
# kata-deploy does NOT set devmapper up for you. Unlike nydus and erofs, it needs
# a thin-pool on the host - a storage layout only you can decide on - so it has to
# exist on every node before this profile is installed. Confirm it is loaded with
# `ctr plugins ls | grep devmapper` (it must report `ok`) and see
# docs/how-to/how-to-use-kata-containers-with-firecracker.md for setting one up.
#
# Usage:
#   helm install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version VERSION \
#     -f https://github.com/kata-containers/kata-containers/releases/download/VERSION/try-kata-fc-runtime-rs.values.yaml

debug: false

# Nothing for kata-deploy to set up: devmapper is configured on the host, and
# kata-deploy only knows how to set up nydus and erofs.
snapshotter:
  setup: []

# Enable the Firecracker runtime-rs shim
# Disable all shims at once, then enable only the one we need.
shims:
  disableAll: true

  fc-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "devmapper" # requires pre-configuration on the user side

# Default shim per architecture.
defaultShim:
  amd64: fc-runtime-rs

runtimeClasses:
  enabled: true
  createDefault: false
  defaultName: "kata"
