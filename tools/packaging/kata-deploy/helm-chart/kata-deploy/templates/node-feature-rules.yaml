{{- /*
NodeFeatureRule teaching node-feature-discovery to advertise the per-node TEE key
counts Kata's confidential shims consume: `sev-snp.amd.com/esids` for AMD SEV-SNP
and `tdx.intel.com/keys` for Intel TDX, plus the labels the matching
RuntimeClasses select on.

A cluster-scoped object with no node-specific content, so the release owns it.
Rendering it from the chart applies it once per release, deletes it on
`helm uninstall`, and avoids granting cluster-wide `nodefeaturerules` write
access to a privileged kata-deploy pod on every node.

The rules match CPU security features, so they are harmless where those features
do not exist; no architecture gating is needed.
*/ -}}
{{- if eq (include "kata-deploy.nfdRulesActive" . | trim) "true" }}
apiVersion: nfd.k8s-sigs.io/v1alpha1
kind: NodeFeatureRule
metadata:
{{- /* Deliberately not the legacy `amd64-tee-keys` name the binary used: Helm
       refuses to adopt an object it did not create, so reusing it would break
       `helm upgrade` on clusters that still have the binary-created one. */}}
{{- if .Values.env.multiInstallSuffix }}
  name: kata-tee-keys-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: kata-tee-keys
{{- end }}
  labels:
    app.kubernetes.io/managed-by: kata-deploy
    app.kubernetes.io/instance: {{ .Release.Name }}
    kata-deploy/instance: {{ .Values.env.multiInstallSuffix | default "default" | quote }}
spec:
  rules:
    - name: "amd.sev-snp"
      labels:
        "amd.feature.node.kubernetes.io/snp": "true"
      extendedResources:
        sev-snp.amd.com/esids: "@cpu.security.sev.encrypted_state_ids"
      matchFeatures:
        - feature: cpu.security
          matchExpressions:
            sev.snp.enabled: { op: Exists }
    - name: "intel.tdx"
      labels:
        "intel.feature.node.kubernetes.io/tdx": "true"
      extendedResources:
        tdx.intel.com/keys: "@cpu.security.tdx.total_keys"
      matchFeatures:
        - feature: cpu.security
          matchExpressions:
            tdx.enabled: { op: Exists }
{{- end }}
