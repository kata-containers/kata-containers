{{- if eq (.Values.deploymentMode | default "daemonset") "daemonset" }}
{{- /*
  Only daemonset mode needs this: its pod labels its own node and reads its own
  kubelet config. Job mode creates no such identity, because its per-node Jobs
  mount no token.
*/}}
---
apiVersion: v1
kind: ServiceAccount
metadata:
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-sa-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-sa
{{- end }}
  namespace: {{ .Release.Namespace }}
  annotations:
    # Keep so DaemonSet pods retain API access during uninstall (SIGTERM cleanup).
    helm.sh/resource-policy: keep
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-role-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-role
{{- end }}
  annotations:
    helm.sh/resource-policy: keep
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "patch"]
# Read kubelet /configz via the apiserver node proxy during host-checks, for
# example to warn about runtimeRequestTimeout values that may be too low.
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
- apiGroups: ["apps"]
  resources: ["daemonsets"]
  verbs: ["get", "list", "watch"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-rb-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-rb
{{- end }}
  annotations:
    helm.sh/resource-policy: keep
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-role-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-role
{{- end }}
subjects:
- kind: ServiceAccount
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-sa-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-sa
{{- end }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- if eq (.Values.deploymentMode | default "daemonset") "job" }}
---
# The only long-lived identity job mode has. All the node-level API work is
# gathered here so that it runs in one unprivileged pod, which can be kept on a
# trusted node, instead of in a privileged pod on every node.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kata-deploy.dispatcherServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Chart.Name }}-dispatcher-noderole{{ with .Values.env.multiInstallSuffix }}-{{ . }}{{ end }}
rules:
# Enumerating nodes is inherently cluster-scoped. `get` re-reads one node (its
# readiness, and the label back after patching it); `patch` sets the
# katacontainers.io/kata-runtime label and lifts start-up taints, which is the
# work the per-node Jobs used to do with a token of their own.
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "get", "patch"]
{{- if include "kata-deploy.kubeletTimeoutWarnSecs" . | trim }}
# Granted only when this configuration pulls or converts images inside
# CreateContainer, which is the one case where the kubelet's
# runtimeRequestTimeout is worth reading and warning about.
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
{{- end }}
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Chart.Name }}-dispatcher-noderb{{ with .Values.env.multiInstallSuffix }}-{{ . }}{{ end }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Chart.Name }}-dispatcher-noderole{{ with .Values.env.multiInstallSuffix }}-{{ . }}{{ end }}
subjects:
- kind: ServiceAccount
  name: {{ include "kata-deploy.dispatcherServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
---
kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Chart.Name }}-dispatcher-role{{ with .Values.env.multiInstallSuffix }}-{{ . }}{{ end }}
  namespace: {{ .Release.Namespace }}
rules:
# The dispatcher only ever creates, polls, and deletes per-node Jobs in its own namespace.
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "delete"]
{{- if (.Values.job.reconcile | default dict).enabled }}
# A scheduled run cannot know the name of the Job the CronJob made for it, so it
# reads its own pod to find it and own the per-node Jobs with it.
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
# And uninstall takes the schedule away before it starts reverting nodes.
- apiGroups: ["batch"]
  resources: ["cronjobs"]
  verbs: ["get", "delete"]
{{- end }}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ .Chart.Name }}-dispatcher-rb{{ with .Values.env.multiInstallSuffix }}-{{ . }}{{ end }}
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Chart.Name }}-dispatcher-role{{ with .Values.env.multiInstallSuffix }}-{{ . }}{{ end }}
subjects:
- kind: ServiceAccount
  name: {{ include "kata-deploy.dispatcherServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
---
# ServiceAccount and RBAC for the post-delete Job that removes the kept RBAC above.
# Created as post-delete hooks with lower weight than the Job so they exist when the Job runs.
apiVersion: v1
kind: ServiceAccount
metadata:
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-sa-cleanup-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-sa-cleanup
{{- end }}
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-cleanup-role-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-cleanup-role
{{- end }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
- apiGroups: ["rbac.authorization.k8s.io"]
  resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
  verbs: ["delete"]
- apiGroups: [""]
  resources: ["serviceaccounts"]
  verbs: ["delete"]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-cleanup-rb-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-cleanup-rb
{{- end }}
  annotations:
    "helm.sh/hook": post-delete
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-cleanup-role-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-cleanup-role
{{- end }}
subjects:
- kind: ServiceAccount
{{- if .Values.env.multiInstallSuffix }}
  name: {{ .Chart.Name }}-sa-cleanup-{{ .Values.env.multiInstallSuffix }}
{{- else }}
  name: {{ .Chart.Name }}-sa-cleanup
{{- end }}
  namespace: {{ .Release.Namespace }}
