# Example values file to enable NVIDIA CPU shims
# This includes all NVIDIA CPU-only shims: qemu-nvidia-cpu,
# qemu-nvidia-cpu-runtime-rs.
#
# Usage:
#   helm install kata-deploy oci://ghcr.io/kata-containers/kata-deploy-charts/kata-deploy \
#     --version VERSION \
#     -f https://github.com/kata-containers/kata-containers/releases/download/VERSION/try-kata-nvidia-cpu.values.yaml

debug: false

# Install Kata via short-lived per-node Jobs instead of an always-on DaemonSet.
# A tiny dispatcher Job fans out one install Job per selected node and exits, so
# nothing keeps running on the node once the install completes.
deploymentMode: job

snapshotter:
  setup: ["erofs"]
  # The NVIDIA CPU runtime-rs handler runs with shared_fs=none and uses the
  # EROFS snapshotter with memory-backed rw layers and dm-verity for lower
  # (image) layer integrity.
  erofsSnapshotterMode: "memory"
  erofsDmverity: true

# The EROFS settings above need erofs-utils >= 1.8.2, newer than most
# distributions package (Ubuntu 24.04 is on 1.7.1). Nodes packaging an older one,
# or none, can be given it from an image by uncommenting the block below: the
# binaries go into /usr/local/bin, ahead of /usr/bin in containerd's PATH, and
# are removed again on uninstall. The install refuses to replace an
# /usr/local/bin/mkfs.erofs it did not put there, and that image is published for
# amd64 and arm64 only.
#
# nodeBinaries:
#   erofs-utils:
#     image: quay.io/kata-containers/erofs-utils:1.9.3
#     binaries: [mkfs.erofs]

# EROFS fs-verity requires the backing filesystem to support fs-verity, and we
# cannot guarantee that on an arbitrary node. Rather than gate this profile on a
# host feature we do not control, we disable fs-verity so it works on the widest
# possible range of setups; we take that hit deliberately to keep the profile
# generic. Ship this as the default containerd erofs snapshotter drop-in for the
# NVIDIA CPU profile so it does not need to be injected out-of-band. It is loaded
# after kata-deploy's generated config, so it overrides the built-in
# enable_fsverity default.
#
# NOTE: This drop-in targets containerd's built-in EROFS snapshotter, which is
# only available on containerd >= 2.2.0 (config version 3, using the
# auto-imported conf.d drop-in mechanism). This is the same minimum kata-deploy
# enforces for the EROFS snapshotter (see check_containerd_erofs_version_support:
# "In order to use erofs-snapshotter containerd must be 2.2.0 or newer"). On
# older containerd releases the erofs snapshotter plugin does not exist and this
# specific "[plugins.'io.containerd.snapshotter.v1.erofs']" key layout will not
# be recognized, so do not expect this profile to work there.
containerd:
  userDropIn: |
    [plugins.'io.containerd.snapshotter.v1.erofs']
      enable_fsverity = false

# Enable NVIDIA CPU shims
# Disable all shims at once, then enable only the ones we need.
shims:
  disableAll: true

  qemu-nvidia-cpu:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: ""

  qemu-nvidia-cpu-runtime-rs:
    enabled: true
    supportedArches:
      - amd64
      - arm64
    allowedHypervisorAnnotations: []
    containerd:
      snapshotter: "erofs"

# Default shim per architecture.
defaultShim:
  amd64: qemu-nvidia-cpu-runtime-rs
  arm64: qemu-nvidia-cpu-runtime-rs

runtimeClasses:
  enabled: true
  createDefault: false
  defaultName: "kata"
