# SELinux support:
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_LSM_MMAP_MIN_ADDR=6553
CONFIG_NETWORK_SECMARK=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9
CONFIG_SECURITY_SELINUX_SID2STR_CACHE_SIZE=256

# LSM initialisation order and the set of LSMs actually enabled at runtime.
# This is SHARED kernel policy, not owned by any single LSM feature: it must
# list every LSM the guest is expected to activate. Adding a new LSM means
# appending it here and is a cross-feature change, not a feature-local one.
#
# The kernel defaults this to all built-in LSMs; stating it explicitly keeps
# the runtime order deterministic instead of depending on Kconfig defaults.
# apparmor is placed before bpf so that AppArmor is initialised ahead of the
# BPF LSM hooks.
CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,apparmor,bpf"
