# SELinux support:
CONFIG_AUDIT=y
CONFIG_AUDITSYSCALL=y
CONFIG_LSM_MMAP_MIN_ADDR=6553
CONFIG_NETWORK_SECMARK=y
CONFIG_SECURITY_NETWORK=y
CONFIG_SECURITY_SELINUX=y
CONFIG_SECURITY_SELINUX_BOOTPARAM=y
CONFIG_SECURITY_SELINUX_DEVELOP=y
CONFIG_SECURITY_SELINUX_SIDTAB_HASH_BITS=9
CONFIG_SECURITY_SELINUX_SID2STR_CACHE_SIZE=256

# Default LSM candidates and initialisation order, subject to boot selection.
# This is SHARED kernel policy, not owned by any single LSM feature: it must
# list every LSM the guest may need to activate. Adding a new LSM means
# appending it here and is a cross-feature change, not a feature-local one.
#
# Keep selinux before apparmor to preserve the existing SELinux-first default
# on kernels with exclusive major LSMs. AppArmor remains before the BPF hooks.
# This list does not imply that SELinux and AppArmor are both active: lsm=
# overrides it, and legacy security= selection depends on the kernel version.
# Confirm the chosen LSMs in the booted guest via /sys/kernel/security/lsm.
CONFIG_LSM="lockdown,yama,loadpin,safesetid,integrity,selinux,apparmor,bpf"
