# AppArmor support for the guest.
#
# The guest kernel must provide AppArmor so that the kata-agent can load
# workload profiles and select one before the workload execve(). The parser
# itself ships in the base image, not here.
# Building AppArmor does not select it at boot. The shared lsm.conf keeps
# SELinux first for compatibility; AppArmor guests must select AppArmor with
# the kernel's supported boot parameters (lsm= or legacy security=) and verify
# /sys/kernel/security/lsm in the booted guest. Do not assume both major LSMs
# are active just because both are built in and listed in CONFIG_LSM.
#
# CONFIG_SECURITYFS is stated explicitly rather than relying on it being
# implied by CONFIG_SECURITY.
CONFIG_SECURITY_APPARMOR=y
# Required by HASH on current kernels. The guest Agent verifies both the loaded
# policy mode and its kernel digest, so name-only introspection is insufficient.
CONFIG_SECURITY_APPARMOR_INTROSPECT_POLICY=y
CONFIG_SECURITY_APPARMOR_HASH=y
CONFIG_SECURITY_APPARMOR_HASH_DEFAULT=y
CONFIG_SECURITYFS=y
