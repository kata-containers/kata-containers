# AppArmor support for the guest.
#
# The guest kernel must provide AppArmor so that the kata-agent can load
# workload profiles and select one before the workload execve(). The parser
# itself ships in the base image, not here.
#
# CONFIG_SECURITYFS is stated explicitly rather than relying on it being
# implied by CONFIG_SECURITY.
CONFIG_SECURITY_APPARMOR=y
CONFIG_SECURITY_APPARMOR_HASH=y
CONFIG_SECURITY_APPARMOR_HASH_DEFAULT=y
CONFIG_SECURITYFS=y
