required_tests:
  # Always required tests
  - Commit Message Check / Commit Message Check
  - Pull request WIP checks / WIP Check
  - Darwin tests / test
  - Shellcheck required / shellcheck-required
  - GHA security analysis / zizmor
  - Lint GHA workflows / run-actionlint
  - EditorConfig checker / editorconfig-checker
  - Check Cargo.toml format / Check Cargo.toml format

required_regexps:
  # Always required regexps

# Integration selection and required checks share the suite names in mapping.
# Path rules are ordered fnmatch patterns; an unmatched path runs every suite.
# Keep shared runtime, agent, rootfs and binary sources unmatched.
dependencies:
  coco-guest-components: [tee]
  coco-trustee: [tee]
paths:
  - paths: [docs/*, '*.md', mkdocs.yaml, tests/spellcheck/kata-dictionary.txt, .claude/*, ci/openshift-ci/*]
    suites: []
    build: false
  - paths: [tests/integration/nerdctl/*]
    suites: [nerdctl]
  - paths: [tests/integration/docker/*]
    suites: [docker]
  - paths: [tests/integration/nydus/*]
    suites: [nydus]
  - paths: [tests/integration/cri-containerd/*]
    suites: [cri, sandboxapi]
  - paths: [tests/stability/*]
    suites: [stability]
  - paths: [tests/functional/kata-agent-apis/*]
    suites: [agent-api]
  - paths: [tests/functional/kata-monitor/*]
    suites: [monitor]
  - paths: [tests/functional/kata-deploy/*]
    suites: [deploy, monitor]
  - paths: [tests/integration/substrate/*]
    suites: [substrate]
  - paths: [src/tools/log-parser/*]
    suites: []
  - paths: [src/tools/genpolicy/*]
    suites: [kubernetes, tee, gpu]
  - paths: [tests/integration/kubernetes/*]
    suites: [kubernetes, tee, gpu]

mapping:
  # Mapping of set-of-tests to required test names and/or test name regexps
  #
  # Format is (test name includes workflow!):
  # {set-of-tests-label}:
  #   jobs: [workflow-file/job-id, ...] # Jobs to schedule for an integration suite
  #   names:
  #     - {required-test-name1}
  #     - {required-test-name2}
  #   regexps: "{python-regular-expression-matching-required-tests}|{another-regexp}|{yet-another-regexp}"
  #   required-labels:
  #     - {label-required-to-run-those-tests}
  #
  # TODO: Add support for "depends" to automatically add dependant set-of-tests
  #       (eg. "build" is required for "test")
  # TODO: Add support for "ignore:" to remove individual tests from regexps
  build:
    names:
      - Kata Containers CI / kata-containers-ci-on-push / build-kata-static-tarball-arm64 / build-asset (openvmm)
    required-labels:
      - ok-to-test
  stability:
