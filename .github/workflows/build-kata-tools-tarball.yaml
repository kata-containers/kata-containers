name: CI | Build kata-tools tarball
on:
  workflow_call:
    inputs:
      arch:
        description: Architecture name used in artifact names and concurrency groups (e.g. amd64)
        required: true
        type: string
      runner:
        description: Runner label to run the build and merge jobs on
        required: true
        type: string
      assets:
        description: JSON array of the tools assets to build (e.g. '["genpolicy","kata-ctl"]')
        required: true
        type: string
      stage:
        required: false
        type: string
        default: test
      tarball-suffix:
        required: false
        type: string
      push-to-registry:
        required: false
        type: string
        default: "no"
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""
    secrets:
      QUAY_DEPLOYER_PASSWORD:
        required: false

permissions: {}

jobs:
  build-tools-asset:
    name: build-tools-asset
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write # needed to push build artifacts to ghcr.io
    strategy:
      matrix:
        asset: ${{ fromJSON(inputs.assets) }}
        stage:
          - ${{ inputs.stage }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.arch }}-${{ toJSON(matrix) }}
      cancel-in-progress: true
    steps:
      - name: Login to Kata Containers quay.io
        if: ${{ inputs.push-to-registry == 'yes' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: quay.io
          username: ${{ vars.QUAY_DEPLOYER_USERNAME }}
          password: ${{ secrets.QUAY_DEPLOYER_PASSWORD }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0 # This is needed in order to keep the commit ids history
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Build ${{ matrix.asset }}
        id: build
        run: |
          make "${KATA_ASSET}-tarball"
          build_dir=$(readlink -f build)
          # store-artifact does not work with symlink
          mkdir -p kata-tools-build && cp "${build_dir}"/kata-static-"${KATA_ASSET}"*.tar.* kata-tools-build/.
        env:
          KATA_ASSET: ${{ matrix.asset }}
          TAR_OUTPUT: ${{ matrix.asset }}.tar.gz
          PUSH_TO_REGISTRY: ${{ inputs.push-to-registry }}
          ARTEFACT_REGISTRY: ghcr.io
          ARTEFACT_REGISTRY_USERNAME: ${{ github.actor }}
          ARTEFACT_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: ${{ inputs.target-branch }}
          RELEASE: ${{ inputs.stage == 'release' && 'yes' || 'no' }}

      - name: store-artifact ${{ matrix.asset }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-tools-artifacts-${{ inputs.arch }}-${{ matrix.asset }}${{ inputs.tarball-suffix }}
          path: kata-tools-build/kata-static-${{ matrix.asset }}.tar.zst
          retention-days: 15
          if-no-files-found: error

  create-kata-tools-tarball:
    name: create-kata-tools-tarball
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    needs: [build-tools-asset]
    permissions:
      contents: read
      packages: write # needed to push build artifacts to ghcr.io
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}
      - name: get-artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: kata-tools-artifacts-${{ inputs.arch }}-*${{ inputs.tarball-suffix }}
          path: kata-tools-artifacts
          merge-multiple: true
      - name: merge-artifacts
        run: |
          ./tools/packaging/kata-deploy/local-build/kata-deploy-merge-builds.sh kata-tools-artifacts versions.yaml kata-tools-static.tar.zst
        env:
          RELEASE: ${{ inputs.stage == 'release' && 'yes' || 'no' }}
      - name: Check kata-tools tarball size (GitHub release asset limit)
        run: |
          # https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases#storage-and-bandwidth-quotas
          GITHUB_ASSET_MAX_BYTES=2147483648
          tarball_size=$(stat -c "%s" kata-tools-static.tar.zst)
          if [[ "${tarball_size}" -ge "${GITHUB_ASSET_MAX_BYTES}" ]]; then
            echo "::error::tarball size (${tarball_size} bytes) >= GitHub release asset limit (${GITHUB_ASSET_MAX_BYTES} bytes)"
            exit 1
          fi
          echo "tarball size: ${tarball_size} bytes"
      - name: store-artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: kata-tools-static-tarball-${{ inputs.arch }}${{ inputs.tarball-suffix }}
          path: kata-tools-static.tar.zst
          retention-days: 15
          if-no-files-found: error
