# Run Kubernetes integration tests on free GitHub runners  with a locally
# deployed cluster (kubeadm).
name: CI | Run kubernetes tests on free runner
on:
  workflow_call:
    inputs:
      tarball-suffix:
        required: false
        type: string
      registry:
        required: true
        type: string
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-free-runner
  cancel-in-progress: true

permissions: {}

jobs:
  run-k8s-tests:
    name: run-k8s-tests
    strategy:
      fail-fast: false
      matrix:
        environment: [
          { vmm: clh, containerd_version: latest },
          { vmm: clh, containerd_version: latest, snapshotter: erofs, erofs_mode: disk, erofs_merge_mode: unmerged },
          { vmm: clh, containerd_version: minimum },
          { vmm: dragonball, containerd_version: latest },
          { vmm: dragonball, containerd_version: minimum },
          { vmm: qemu, containerd_version: latest },
          { vmm: qemu, containerd_version: latest, snapshotter: erofs, erofs_mode: disk, erofs_merge_mode: unmerged },
          { vmm: qemu, containerd_version: minimum },
          { vmm: qemu-runtime-rs, containerd_version: latest },
          { vmm: qemu-runtime-rs, containerd_version: minimum },
          { vmm: clh-runtime-rs, containerd_version: latest },
          { vmm: clh-runtime-rs, containerd_version: latest, snapshotter: erofs, erofs_mode: disk, erofs_merge_mode: unmerged },
          { vmm: clh-runtime-rs, containerd_version: minimum },
          { vmm: fc, containerd_version: latest, snapshotter: devmapper },
          { vmm: rs-fc, containerd_version: latest, snapshotter: devmapper },
          { vmm: qemu-nvidia-cpu, containerd_version: latest },
          { vmm: qemu-nvidia-cpu-runtime-rs, containerd_version: latest, snapshotter: erofs, erofs_mode: memory, erofs_dmverity: dmverity, ip_family: ipv4, cni: bridge },
          { vmm: qemu-nvidia-cpu-runtime-rs, containerd_version: latest, snapshotter: erofs, erofs_mode: memory, erofs_dmverity: dmverity, ip_family: ipv6, cni: bridge },
          { vmm: qemu-nvidia-cpu-runtime-rs, containerd_version: latest, snapshotter: erofs, erofs_mode: memory, erofs_dmverity: dmverity, ip_family: dual, cni: bridge },
        ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-free-runner-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HOST_OS: ubuntu
      KATA_HYPERVISOR: ${{ matrix.environment.vmm }}
      KUBERNETES: vanilla
      K8S_IP_FAMILY: ${{ matrix.environment.ip_family }}
      K8S_CNI: ${{ matrix.environment.cni }}
      K8S_TEST_HOST_TYPE: baremetal-no-attestation
      CONTAINER_ENGINE: containerd
      CONTAINER_ENGINE_VERSION: ${{ matrix.environment.containerd_version }}
      SNAPSHOTTER: ${{ matrix.environment.snapshotter }}
      EROFS_SNAPSHOTTER_MODE: ${{ matrix.environment.erofs_mode }}
      EROFS_DMVERITY: ${{ matrix.environment.erofs_dmverity }}
      EROFS_MERGE_MODE: ${{ matrix.environment.erofs_merge_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit-hash }}
          allow-unsafe-pr-checkout: true
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Check Firecracker prerequisites
        if: matrix.environment.vmm == 'fc' || matrix.environment.vmm == 'rs-fc'
        run: |
          sudo test -c /dev/kvm
          echo "start_time=$(date '+%Y-%m-%d %H:%M:%S')" >> "${GITHUB_ENV}"

      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ inputs.tarball-suffix }}
          path: kata-tools-artifacts

      - name: Install kata-tools
        run: bash tests/integration/kubernetes/gha-run.sh install-kata-tools kata-tools-artifacts

      - name: Remove unnecessary directories to free up space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /usr/lib/firefox

      - name: Deploy k8s (kubeadm)
        run: bash tests/integration/kubernetes/gha-run.sh deploy-k8s

      - name: Install `bats`
        run: bash tests/integration/kubernetes/gha-run.sh install-bats

      - name: Test runtime selection helpers
        if: matrix.environment.vmm == 'fc' || matrix.environment.vmm == 'rs-fc'
        run: bats tests/functional/runtime-selection.bats

      - name: Configure devmapper
        if: matrix.environment.snapshotter == 'devmapper'
        run: bash tests/integration/kubernetes/gha-run.sh configure-snapshotter

      - name: Deploy Kata
        timeout-minutes: 20
        run: bash tests/integration/kubernetes/gha-run.sh deploy-kata

      - name: Run tests
        timeout-minutes: 60
        run: bash tests/integration/kubernetes/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/integration/kubernetes/gha-run.sh report-tests

      - name: Collect Firecracker artifacts
        if: always() && (matrix.environment.vmm == 'fc' || matrix.environment.vmm == 'rs-fc')
        run: bash tests/integration/kubernetes/gha-run.sh collect-artifacts

      - name: Upload Firecracker artifacts
        if: always() && (matrix.environment.vmm == 'fc' || matrix.environment.vmm == 'rs-fc')
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: firecracker-k8s-${{ matrix.environment.vmm }}-${{ inputs.tag }}
          path: |
            /tmp/artifacts
            tests/integration/kubernetes/reports
          retention-days: 7

      - name: Delete kata-deploy
        if: always()
        timeout-minutes: 15
        run: bash tests/integration/kubernetes/gha-run.sh cleanup
