# Run Kubernetes integration tests on free GitHub runners  with a locally
# deployed cluster (kubeadm).
name: CI | Run kubernetes tests on free runner
on:
  workflow_call:
    inputs:
      tarball-suffix:
        required: false
        type: string
      registry:
        required: true
        type: string
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-free-runner
  cancel-in-progress: true

permissions: {}

jobs:
  run-k8s-tests:
    name: run-k8s-tests
    strategy:
      fail-fast: false
      matrix:
        environment: [
          { vmm: clh, containerd_version: latest },
          { vmm: clh, containerd_version: latest, snapshotter: erofs, erofs_mode: disk, erofs_merge_mode: unmerged },
          { vmm: clh, containerd_version: minimum },
          { vmm: dragonball, containerd_version: latest },
          { vmm: dragonball, containerd_version: minimum },
          { vmm: qemu, containerd_version: latest },
          { vmm: qemu, containerd_version: latest, snapshotter: erofs, erofs_mode: disk, erofs_merge_mode: unmerged },
          { vmm: qemu, containerd_version: minimum },
          { vmm: qemu-runtime-rs, containerd_version: latest },
          { vmm: qemu-runtime-rs, containerd_version: minimum },
          # Separate opt-in legs; regular QEMU suites keep their default guest.
          { vmm: qemu, containerd_version: latest, guest_apparmor: "yes", k8s_test_union: k8s-apparmor.bats },
          { vmm: qemu-runtime-rs, containerd_version: latest, guest_apparmor: "yes", k8s_test_union: k8s-apparmor.bats },
          { vmm: clh-runtime-rs, containerd_version: latest },
          # TODO: Remove k8s_test_union once CLH supports multi-layer images with EROFS.
          { vmm: clh-runtime-rs, containerd_version: latest, snapshotter: erofs, erofs_mode: disk, erofs_merge_mode: unmerged, k8s_test_union: k8s-vm-templating.bats },
          { vmm: clh-runtime-rs, containerd_version: minimum },
          { vmm: qemu-nvidia-cpu, containerd_version: latest },
          { vmm: qemu-nvidia-cpu-runtime-rs, containerd_version: latest, snapshotter: erofs, erofs_mode: memory, erofs_dmverity: dmverity },
        ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-free-runner-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HOST_OS: ubuntu
      KATA_HYPERVISOR: ${{ matrix.environment.vmm }}
      KUBERNETES: vanilla
      K8S_TEST_HOST_TYPE: baremetal-no-attestation
      K8S_TEST_UNION: ${{ matrix.environment.k8s_test_union }}
      KATA_GUEST_APPARMOR_TEST: ${{ matrix.environment.guest_apparmor || 'no' }}
      KATA_K8S_APPARMOR_API: field
      K8S_TEST_DEBUG_RETRY: ${{ matrix.environment.guest_apparmor == 'yes' && 'false' || 'true' }}
      CONTAINER_ENGINE: containerd
      CONTAINER_ENGINE_VERSION: ${{ matrix.environment.containerd_version }}
      SNAPSHOTTER: ${{ matrix.environment.snapshotter }}
      EROFS_SNAPSHOTTER_MODE: ${{ matrix.environment.erofs_mode }}
      EROFS_DMVERITY: ${{ matrix.environment.erofs_dmverity }}
      EROFS_MERGE_MODE: ${{ matrix.environment.erofs_merge_mode }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Prepare AppArmor evidence directory
        if: matrix.environment.guest_apparmor == 'yes'
        run: |
          evidence_dir="${RUNNER_TEMP}/guest-apparmor-evidence"
          mkdir -p "$evidence_dir"
          printf 'KATA_GUEST_APPARMOR_EVIDENCE_DIR=%s\n' "$evidence_dir" >> "$GITHUB_ENV"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ inputs.tarball-suffix }}
          path: kata-tools-artifacts

      - name: Install kata-tools
        run: bash tests/integration/kubernetes/gha-run.sh install-kata-tools kata-tools-artifacts

      - name: Remove unnecessary directories to free up space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /usr/lib/firefox

      - name: Deploy k8s (kubeadm)
        run: bash tests/integration/kubernetes/gha-run.sh deploy-k8s

      - name: Install `bats`
        run: bash tests/integration/kubernetes/gha-run.sh install-bats

      - name: Deploy Kata
        timeout-minutes: 20
        run: bash tests/integration/kubernetes/gha-run.sh deploy-kata

      - name: Configure systemd guest and real AppArmor CI fixture
        if: matrix.environment.guest_apparmor == 'yes'
        timeout-minutes: 10
        run: |
          mkdir -p "$KATA_GUEST_APPARMOR_EVIDENCE_DIR"
          sudo apt-get update
          sudo apt-get install -y apparmor cryptsetup-bin python3 util-linux
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,KATA_GUEST_APPARMOR_TEST,KATA_HYPERVISOR \
            bash tests/integration/kubernetes/guest-apparmor-ci.sh configure \
            2>&1 | tee "$KATA_GUEST_APPARMOR_EVIDENCE_DIR/configure.log"

      - name: Run tests
        timeout-minutes: 60
        run: bash tests/integration/kubernetes/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/integration/kubernetes/gha-run.sh report-tests

      - name: Collect AppArmor runner, runtime, agent and guest-console evidence
        if: always() && matrix.environment.guest_apparmor == 'yes'
        run: |
          mkdir -p "$KATA_GUEST_APPARMOR_EVIDENCE_DIR"
          # Hypervisor and agent debugging are enabled in the CI drop-in;
          # their console/log output is forwarded to the runner journal.
          sudo journalctl --no-pager > "$KATA_GUEST_APPARMOR_EVIDENCE_DIR/runner-journal.log"
          sudo containerd --config /etc/containerd/config.toml config dump \
            > "$KATA_GUEST_APPARMOR_EVIDENCE_DIR/containerd-effective.toml"

      - name: Upload AppArmor evidence (approval alone is not a test result)
        if: always() && matrix.environment.guest_apparmor == 'yes'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: guest-apparmor-${{ matrix.environment.vmm }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/guest-apparmor-evidence
            tests/integration/kubernetes/reports

      - name: Remove the temporary host AppArmor fixture and guest CI drop-in
        if: always() && matrix.environment.guest_apparmor == 'yes'
        timeout-minutes: 3
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,KATA_GUEST_APPARMOR_TEST,KATA_HYPERVISOR \
            bash tests/integration/kubernetes/guest-apparmor-ci.sh cleanup

      - name: Delete kata-deploy
        if: always()
        timeout-minutes: 15
        run: bash tests/integration/kubernetes/gha-run.sh cleanup
