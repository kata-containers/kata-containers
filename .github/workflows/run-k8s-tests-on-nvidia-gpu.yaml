name: CI | Run NVIDIA GPU kubernetes tests
on:
  workflow_call:
    inputs:
      arch:
        required: false
        type: string
        default: amd64
      tarball-suffix:
        required: true
        type: string
      registry:
        required: true
        type: string
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""
      enable-nvrc-trace:
        required: false
        type: boolean
        default: true
    secrets:
      NGC_API_KEY:
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-nvidia-gpu-${{ inputs.arch }}
  cancel-in-progress: true

permissions: {}

jobs:
  run-nvidia-gpu-tests:
    name: run-${{ matrix.environment.name }}-tests-on-${{ inputs.arch }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(inputs.arch == 'arm64' && '[
          {"name":"nvidia-gpu-runtime-rs", "vmm":"qemu-nvidia-gpu-runtime-rs", "runner":"arm64-nvidia-gpu", "coco":false, "snapshotter":"erofs", "skip-multi-gpu-tests":true}
          ]' || '[
          {"name":"nvidia-gpu", "vmm":"qemu-nvidia-gpu", "runner":"amd64-nvidia-a100", "coco":false, "snapshotter":""},
          {"name":"nvidia-gpu-runtime-rs", "vmm":"qemu-nvidia-gpu-runtime-rs", "runner":"amd64-nvidia-a100", "coco":false, "snapshotter":"erofs"},
          {"name":"nvidia-gpu-snp", "vmm":"qemu-nvidia-gpu-snp", "runner":"amd64-nvidia-h100-snp", "coco":true, "snapshotter":"nydus"},
          {"name":"nvidia-gpu-snp-runtime-rs", "vmm":"qemu-nvidia-gpu-snp-runtime-rs", "runner":"amd64-nvidia-h100-snp", "coco":true, "snapshotter":"nydus"}
          ]') }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ${{ matrix.environment.runner }}
    timeout-minutes: 70
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HYPERVISOR: ${{ matrix.environment.vmm }}
      KUBERNETES: kubeadm
      KBS: ${{ matrix.environment.coco && 'true' || 'false' }}
      SKIP_MULTI_GPU_TESTS: ${{ matrix.environment.skip-multi-gpu-tests && 'true' || 'false' }}
      SNAPSHOTTER: ${{ matrix.environment.snapshotter }}
      EROFS_SNAPSHOTTER_MODE: ${{ matrix.environment.snapshotter == 'erofs' && 'memory' || '' }}
      EROFS_DMVERITY: ${{ matrix.environment.snapshotter == 'erofs' && 'dmverity' || '' }}
      K8S_TEST_HOST_TYPE: baremetal
      TARGET_ARCH: ${{ inputs.arch == 'arm64' && 'aarch64' || 'x86_64' }}
    steps:
      - name: Check ARM64 runner disk space
        if: inputs.arch == 'arm64'
        run: |
          # Model images, snapshots and caches need space beyond kata-deploy.
          # Fail before pulling images; keep existing workloads and caches intact.
          df -h / /var/lib/containerd "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}"
          for path in / /var/lib/containerd "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}"; do
            available_kib=$(df -Pk "${path}" | awk 'NR == 2 { print $4 }')
            if (( available_kib < 60 * 1024 * 1024 )); then
              echo "::error::${path} has less than 60 GiB free; reclaim space before retrying."
              exit 1
            fi
          done

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-${{ inputs.arch }}${{ inputs.tarball-suffix }}
          path: kata-tools-artifacts

      - name: Install kata-tools
        run: bash tests/integration/kubernetes/gha-run.sh install-kata-tools kata-tools-artifacts

      - name: Uninstall previous `kbs-client`
        if: matrix.environment.coco
        timeout-minutes: 10
        run: bash tests/integration/kubernetes/gha-run.sh uninstall-kbs-client

      # On SNP the deploy refreshes the VCEK cache, which may build snphost first.
      - name: Deploy CoCo KBS
        if: matrix.environment.coco
        timeout-minutes: 20
        run: bash tests/integration/kubernetes/gha-run.sh deploy-coco-kbs
        env:
          NVIDIA_VERIFIER_MODE: remote
          KBS_INGRESS: nodeport

      - name: Install `kbs-client`
        if: matrix.environment.coco
        timeout-minutes: 10
        run: bash tests/integration/kubernetes/gha-run.sh install-kbs-client

      - name: Deploy Kata
        timeout-minutes: 20
        run: bash tests/integration/kubernetes/gha-run.sh deploy-kata

      - name: Install `bats`
        run: bash tests/integration/kubernetes/gha-run.sh install-bats

      - name: Run tests ${{ matrix.environment.vmm }}
        timeout-minutes: 60
        run: |
          if [[ "${KBS}" == "true" ]]; then
            cache_dir="${HOME}/.cache/kata-containers/genpolicy"
            mkdir -p "${cache_dir}"
            export GENPOLICY_LAYERS_CACHE_FILE_PATH="${cache_dir}/layers-cache.json"
          fi

          bash tests/integration/kubernetes/gha-run.sh run-nv-tests
        env:
          NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
          ENABLE_NVRC_TRACE: ${{ inputs.enable-nvrc-trace }}

      - name: Report tests
        if: always()
        run: bash tests/integration/kubernetes/gha-run.sh report-tests

      - name: Collect artifacts ${{ matrix.environment.vmm }}
        if: always()
        run: bash tests/integration/kubernetes/gha-run.sh collect-artifacts
        continue-on-error: true

      - name: Archive artifacts ${{ matrix.environment.vmm }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: k8s-tests-${{ matrix.environment.vmm }}-${{ inputs.arch }}-kubeadm-${{ inputs.tag }}
          path: /tmp/artifacts
          retention-days: 1

      - name: Delete kata-deploy
        if: always()
        timeout-minutes: 15
        run: bash tests/integration/kubernetes/gha-run.sh cleanup

      - name: Delete CoCo KBS
        if: always() && matrix.environment.coco
        timeout-minutes: 10
        run: |
          bash tests/integration/kubernetes/gha-run.sh delete-coco-kbs

      - name: Report ARM64 runner disk space after cleanup
        if: always() && inputs.arch == 'arm64'
        run: df -h / /var/lib/containerd "${RUNNER_TEMP}" "${GITHUB_WORKSPACE}"
