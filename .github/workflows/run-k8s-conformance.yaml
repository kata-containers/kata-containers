# Run the upstream Kubernetes conformance suite on a kubeadm cluster.
#
# The hypervisors live in the list below. k8s-conformance.yaml and the
# k8s-conformance input of ci-devel select from that list: "all", or a
# comma-separated subset such as "qemu-runtime-rs,clh-runtime-rs".
name: CI | Run kubernetes conformance
on:
  workflow_call:
    inputs:
      tarball-suffix:
        required: false
        type: string
      registry:
        required: true
        type: string
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""
      hypervisors:
        required: true
        type: string

permissions: {}

jobs:
  select-hypervisors:
    name: select hypervisors
    runs-on: ubuntu-24.04
    outputs:
      include: ${{ steps.matrix.outputs.include }}
    steps:
      - name: Build the conformance matrix
        id: matrix
        env:
          HYPERVISORS: ${{ inputs.hypervisors }}
        run: |
          python3 - << 'PY'
          import json
          import os

          # qemu-nvidia-cpu-runtime-rs ships with the erofs snapshotter in
          # memory mode and dm-verity. The other entries use the default
          # snapshotter.
          #
          # clh-azure-runtime-rs is not listed. It loads its guest kernel from
          # /usr/share/cloud-hypervisor/vmlinux.bin, which is part of the host
          # image on Azure. GitHub-hosted Ubuntu does not ship it, so no
          # sandbox can start there.
          entries = [
              {"vmm": "qemu-runtime-rs", "snapshotter": "", "erofs_mode": "", "erofs_dmverity": ""},
              {"vmm": "qemu-nvidia-cpu-runtime-rs", "snapshotter": "erofs", "erofs_mode": "memory", "erofs_dmverity": "dmverity"},
              {"vmm": "clh-runtime-rs", "snapshotter": "", "erofs_mode": "", "erofs_dmverity": ""},
              {"vmm": "dragonball", "snapshotter": "", "erofs_mode": "", "erofs_dmverity": ""},
              {"vmm": "openvmm-azure-runtime-rs", "snapshotter": "", "erofs_mode": "", "erofs_dmverity": ""},
          ]
          selected = os.environ["HYPERVISORS"].strip()
          if selected != "all":
              wanted = {name.strip() for name in selected.split(",") if name.strip()}
              known = [entry["vmm"] for entry in entries]
              unknown = sorted(wanted.difference(known))
              if unknown:
                  raise SystemExit(
                      "unknown hypervisor(s): "
                      + ", ".join(unknown)
                      + "; known: "
                      + ", ".join(known)
                  )
              entries = [entry for entry in entries if entry["vmm"] in wanted]
          if not entries:
              raise SystemExit("no hypervisors selected")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("include=" + json.dumps(entries) + "\n")
          PY

  run-k8s-conformance:
    name: conformance (${{ matrix.environment.vmm }})
    needs: select-hypervisors
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(needs.select-hypervisors.outputs.include) }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-conformance-${{ matrix.environment.vmm }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HOST_OS: ubuntu
      KATA_HYPERVISOR: ${{ matrix.environment.vmm }}
      KUBERNETES: vanilla
      K8S_TEST_HOST_TYPE: baremetal-no-attestation
      CONTAINER_ENGINE: containerd
      CONTAINER_ENGINE_VERSION: latest
      SNAPSHOTTER: ${{ matrix.environment.snapshotter }}
      EROFS_SNAPSHOTTER_MODE: ${{ matrix.environment.erofs_mode }}
      EROFS_DMVERITY: ${{ matrix.environment.erofs_dmverity }}
      # The runner has 4 vCPUs, and each test pod is its own VM.
      CONFORMANCE_PARALLEL_NODES: "2"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: get-kata-tools-tarball
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: kata-tools-static-tarball-amd64${{ inputs.tarball-suffix }}
          path: kata-tools-artifacts

      - name: Install kata-tools
        run: bash tests/integration/kubernetes/gha-run.sh install-kata-tools kata-tools-artifacts

      - name: Remove unnecessary directories to free up space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /usr/lib/firefox

      - name: Deploy k8s (kubeadm)
        run: bash tests/integration/kubernetes/gha-run.sh deploy-k8s

      - name: Deploy Kata
        timeout-minutes: 20
        run: bash tests/integration/kubernetes/gha-run.sh deploy-kata

      - name: Run the conformance suite
        timeout-minutes: 200
        run: bash tests/integration/kubernetes/gha-run.sh run-conformance

      - name: Delete kata-deploy
        if: always()
        timeout-minutes: 15
        run: bash tests/integration/kubernetes/gha-run.sh cleanup
