name: Remove ok-to-test label on synchronize

# When a PR receives new commits (synchronize), remove the 'ok-to-test' label
# unless the user who pushed them has write access to this repository. This
# prevents a contributor from receiving the label on a benign commit and then
# force-pushing arbitrary code that runs in the privileged CI context
# (pull_request_target) with access to repository secrets.

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] See #11332.
    types:
      - synchronize

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  remove-label-on-synchronize:
    name: Remove ok-to-test on synchronize
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write # needed to remove the ok-to-test label
    steps:
      - name: Remove ok-to-test label if the pusher lacks write access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSHER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          has_label=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json labels \
            --jq 'any(.labels[]; .name == "ok-to-test")')
          if [[ "${has_label}" != "true" ]]; then
            echo "No 'ok-to-test' label on PR ${PR_NUMBER} - nothing to do."
            exit 0
          fi

          # The collaborator permission API reflects repository access rather
          # than org membership, so it is not affected by members who keep
          # their org membership private (which author_association is).
          # Fail closed: if the lookup fails, treat the pusher as untrusted.
          permission=$(gh api "repos/${REPO}/collaborators/${PUSHER}/permission" \
            --jq '.permission' 2>/dev/null || echo "unknown")

          if [[ "${permission}" == "admin" || "${permission}" == "write" ]]; then
            echo "Pusher '${PUSHER}' has '${permission}' access - label retained."
            exit 0
          fi

          echo "Pusher '${PUSHER}' has '${permission}' access - removing 'ok-to-test' label."
          gh pr edit "${PR_NUMBER}" --repo "${REPO}" --remove-label "ok-to-test"
        shell: bash
