name: CI | Run kata-deploy tests
on:
  workflow_call:
    inputs:
      registry:
        required: true
        type: string
      repo:
        required: true
        type: string
      tag:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      commit-hash:
        required: false
        type: string
      target-branch:
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-kata-deploy
  cancel-in-progress: true

permissions: {}

jobs:
  run-kata-deploy-tests:
    name: run-kata-deploy-tests (${{ matrix.environment.vmm }}, ${{ matrix.environment.k8s }})
    strategy:
      fail-fast: false
      matrix:
        environment: [
          { vmm: qemu-runtime-rs, k8s: k0s },
          { vmm: qemu-runtime-rs, k8s: k3s },
          { vmm: qemu-runtime-rs, k8s: rke2 },
          { vmm: qemu-runtime-rs, k8s: microk8s },
          { vmm: qemu-nvidia-cpu-runtime-rs, k8s: kubeadm, snapshotter: erofs, erofs_snapshotter_mode: disk, erofs_dmverity: dmverity },
        ]
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}-${{ toJSON(matrix) }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_HYPERVISOR: ${{ matrix.environment.vmm }}
      KUBERNETES: ${{ matrix.environment.k8s }}
      # Only used when deploying the kubeadm flavour
      CONTAINER_ENGINE: containerd
      CONTAINER_ENGINE_VERSION: latest
      # Only the kubeadm flavour runs EROFS, so that is where the host module
      # coverage lives: nothing loads them but the install itself.
      SNAPSHOTTER: ${{ matrix.environment.snapshotter }}
      EROFS_SNAPSHOTTER_MODE: ${{ matrix.environment.erofs_snapshotter_mode }}
      EROFS_DMVERITY: ${{ matrix.environment.erofs_dmverity }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Remove unnecessary directories to free up space
        run: |
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /opt/az
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft
          sudo rm -rf /opt/google
          sudo rm -rf /usr/lib/firefox

      - name: Deploy ${{ matrix.environment.k8s }}
        run:  bash tests/functional/kata-deploy/gha-run.sh deploy-k8s

      - name: Install `bats`
        run: bash tests/functional/kata-deploy/gha-run.sh install-bats

      - name: Run tests
        run: bash tests/functional/kata-deploy/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/functional/kata-deploy/gha-run.sh report-tests

  run-kata-deploy-mixed-shims:
    concurrency:
      group: ${{ github.workflow }}-${{ github.job }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-26.04
    env:
      DOCKER_REGISTRY: ${{ inputs.registry }}
      DOCKER_REPO: ${{ inputs.repo }}
      DOCKER_TAG: ${{ inputs.tag }}
      GH_PR_NUMBER: ${{ inputs.pr-number }}
      KATA_DEPLOY_TEST_UNION: kata-deploy-mixed-shims.bats
      KATA_HYPERVISOR: qemu
      KUBERNETES: k3s
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.commit-hash }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase atop of the latest target branch
        run: |
          ./tests/git-helper.sh "rebase-atop-of-the-latest-target-branch"
        env:
          TARGET_BRANCH: ${{ inputs.target-branch }}

      - name: Deploy k3s
        run: bash tests/functional/kata-deploy/gha-run.sh deploy-k8s

      - name: Install `bats`
        run: bash tests/functional/kata-deploy/gha-run.sh install-bats

      - name: Run mixed-shim test
        run: bash tests/functional/kata-deploy/gha-run.sh run-tests

      - name: Report tests
        if: always()
        run: bash tests/functional/kata-deploy/gha-run.sh report-tests

      - name: Clean up mixed-shim deployment
        if: always()
        run: |
          kubectl delete pods -l test=kata-deploy-mixed-shims --ignore-not-found=true --wait=true --timeout=180s || true
          helm uninstall kata-deploy -n kube-system --ignore-not-found --wait --timeout 10m || true
