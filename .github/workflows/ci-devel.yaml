name: Kata Containers CI (manually triggered)
on:
  workflow_dispatch:

concurrency:
  group: tdx-nfd-recovery
  cancel-in-progress: false

permissions: {}

jobs:
  recover-tdx:
    name: Remove stale NFD CRDs on TDX
    runs-on: tdx
    timeout-minutes: 5
    steps:
      - name: Delete NFD CRDs
        run: |
          kubectl delete crd --ignore-not-found --timeout=2m \
            nodefeatures.nfd.k8s-sigs.io \
            nodefeaturerules.nfd.k8s-sigs.io \
            nodefeaturegroups.nfd.k8s-sigs.io
