name: Kata Containers CI (manually triggered)
on:
  workflow_dispatch:
    inputs:
      tee-test-scope:
        description: "TEE test scope: small runs only attestation + policy tests, full runs everything"
        required: false
        type: choice
        options:
          - small
          - full
        default: small

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-devel
  cancel-in-progress: true

permissions: {}

jobs:
  #kata-containers-ci-on-push:
  #  permissions:
  #    contents: read
  #    packages: write # needed to push build artifacts to ghcr.io
  #    id-token: write # needed to sign images and generate attestations
  #    attestations: write # needed to generate artifact attestations
  #  uses: ./.github/workflows/ci.yaml
  #  with:
  #    commit-hash: ${{ github.sha }}
  #    pr-number: "dev"
  #    tag: ${{ github.sha }}-dev
  #    target-branch: ${{ github.ref_name }}
  #    extensive-matrix-autogenerated-policy: "yes"
  #    tee-test-scope: ${{ inputs.tee-test-scope || 'small' }}

  #  secrets:
  #    AUTHENTICATED_IMAGE_PASSWORD: ${{ secrets.AUTHENTICATED_IMAGE_PASSWORD }}
  #    AZ_APPID: ${{ secrets.AZ_APPID }}
  #    AZ_TENANT_ID: ${{ secrets.AZ_TENANT_ID }}
  #    AZ_SUBSCRIPTION_ID: ${{ secrets.AZ_SUBSCRIPTION_ID }}
  #    QUAY_DEPLOYER_PASSWORD: ${{ secrets.QUAY_DEPLOYER_PASSWORD }}
  #    NGC_API_KEY: ${{ secrets.NGC_API_KEY }}
  #    KBUILD_SIGN_PIN: ${{ secrets.KBUILD_SIGN_PIN }}

  #build-checks:
  #  strategy:
  #    fail-fast: false
  #    matrix:
  #      # Keep this matrix in sync with the one in static-checks-self-hosted.yaml + static-checks.yaml
  #      instance:
  #        - "ubuntu-24.04"
  #        - "ubuntu-24.04-arm"
  #        - "ubuntu-26.04-s390x"
  #        - "ppc64le"
  #  uses: ./.github/workflows/build-checks.yaml
  #  with:
  #    instance: ${{ matrix.instance }}

  # THROWAWAY probe: does `github.job` evaluate to an empty string in a
  # job-level `concurrency.group`, and is that specific to nested workflows?
  # Each pair differs ONLY by job id. If `github.job` is empty at this level,
  # both jobs of a pair resolve to the same group and one is cancelled.
  probe-direct-a:
    name: probe-direct-a
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-probe-direct-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Hold the concurrency group for a while
        run: |
          echo "runtime github.job=${GITHUB_JOB}"
          sleep 60
          echo "finished without being cancelled"

  probe-direct-b:
    name: probe-direct-b
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-probe-direct-${{ github.job }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Hold the concurrency group for a while
        run: |
          echo "runtime github.job=${GITHUB_JOB}"
          sleep 60
          echo "finished without being cancelled"

  # Same pair, but inside a reusable workflow called from here.
  probe-nested:
    permissions: {}
    uses: ./.github/workflows/concurrency-probe-nested.yaml

  # Positive control: identical literal group, so exactly one of the two MUST
  # be cancelled. If neither is, the jobs did not overlap and the probes above
  # prove nothing.
  probe-control-a:
    name: probe-control-a
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-probe-control-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Hold the concurrency group for a while
        run: |
          sleep 60
          echo "finished without being cancelled"

  probe-control-b:
    name: probe-control-b
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-probe-control-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Hold the concurrency group for a while
        run: |
          sleep 60
          echo "finished without being cancelled"

  probe-report:
    name: probe-report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [probe-direct-a, probe-direct-b, probe-nested, probe-control-a, probe-control-b]
    if: ${{ always() }}
    permissions: {}
    concurrency:
      group: ${{ github.workflow }}-probe-report-${{ github.ref }}
      cancel-in-progress: true
    env:
      DIRECT_A: ${{ needs.probe-direct-a.result }}
      DIRECT_B: ${{ needs.probe-direct-b.result }}
      NESTED: ${{ needs.probe-nested.result }}
      CONTROL_A: ${{ needs.probe-control-a.result }}
      CONTROL_B: ${{ needs.probe-control-b.result }}
    steps:
      - name: Summarize
        run: |
          {
            echo "| probe | result |"
            echo "|---|---|"
            echo "| direct a | ${DIRECT_A} |"
            echo "| direct b | ${DIRECT_B} |"
            echo "| nested (a+b, aggregate) | ${NESTED} |"
            echo "| control a | ${CONTROL_A} |"
            echo "| control b | ${CONTROL_B} |"
          } | tee -a "${GITHUB_STEP_SUMMARY}"
