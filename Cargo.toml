[workspace.package]
authors = ["The Kata Containers community <kata-dev@lists.katacontainers.io>"]
edition = "2018"
license = "Apache-2.0"
rust-version = "1.95"

[workspace]
members = [
  # libs
  "src/libs/kata-sys-util",
  "src/libs/kata-types",
  "src/libs/logging",
  "src/libs/mem-agent",
  "src/libs/pod-resources-rs",
  "src/libs/protocols",
  "src/libs/runtime-spec",
  "src/libs/safe-path",
  "src/libs/shim-interface",
  "src/libs/test-utils",

  # kata-agent
  "src/agent",
  "src/agent/policy",
  "src/agent/rustjail",
  "src/agent/vsock-exporter",

  # Dragonball
  "src/dragonball",
  "src/dragonball/crates/dbs_acpi",
  "src/dragonball/crates/dbs_address_space",
  "src/dragonball/crates/dbs_allocator",
  "src/dragonball/crates/dbs_arch",
  "src/dragonball/crates/dbs_boot",
  "src/dragonball/crates/dbs_device",
  "src/dragonball/crates/dbs_interrupt",
  "src/dragonball/crates/dbs_legacy_devices",
  "src/dragonball/crates/dbs_pci",
  "src/dragonball/crates/dbs_snapshot",
  "src/dragonball/crates/dbs_upcall",
  "src/dragonball/crates/dbs_utils",
  "src/dragonball/crates/dbs_virtio_devices",

  # tools
  "src/tools/agent-ctl",
  "src/tools/genpolicy",
  "src/tools/kata-ctl",
  "src/tools/trace-forwarder",

  # kata-deploy (Kubernetes installer binary)
  "tools/packaging/kata-deploy/binary",

  # runtime-rs
  "src/runtime-rs",
  "src/runtime-rs/crates/agent",
  "src/runtime-rs/crates/hypervisor",
  "src/runtime-rs/crates/persist",
  "src/runtime-rs/crates/resource",
  "src/runtime-rs/crates/runtimes",
  "src/runtime-rs/crates/service",
  "src/runtime-rs/crates/shim",
  "src/runtime-rs/crates/shim-ctl",
  "src/runtime-rs/tests/utils",
]
resolver = "2"

# TODO: Add all excluded crates to root workspace
exclude = [
  "src/tools",

  # We are cloning and building rust packages under
  # "tools/packaging/kata-deploy/local-build/build" folder, which may mislead
  # those packages to think they are part of the kata root workspace
  "tools/packaging/kata-deploy/local-build/build",

  # Exclude vendor directories created by cargo vendor
  "src/agent/vendor",
  "src/runtime-rs/vendor",
  "src/tools/agent-ctl/vendor",
  "src/tools/genpolicy/vendor",
  "src/tools/kata-ctl/vendor",
  "src/tools/trace-forwarder/vendor",
  "tools/packaging/kata-deploy/binary/vendor",
  "vendor",
]

[workspace.dependencies]
# Rust-VMM crates
event-manager = "0.4.0"
kvm-bindings = "0.14.0"
kvm-ioctls = "0.24.0"
linux-loader = "0.13.0"
seccompiler = "0.5.0"
vfio-bindings = "0.6.2"
vfio-ioctls = "0.6.0"
virtio-bindings = "0.2.0"
virtio-queue = "0.17.0"
vm-fdt = "0.3.0"
vm-memory = "=0.17.1"
vm-superio = "0.8.0"
vmm-sys-util = "0.15.0"

# Local dependencies from Dragonball Sandbox crates
dbs-acpi = { path = "src/dragonball/crates/dbs_acpi" }
dbs-address-space = { path = "src/dragonball/crates/dbs_address_space" }
dbs-allocator = { path = "src/dragonball/crates/dbs_allocator" }
dbs-arch = { path = "src/dragonball/crates/dbs_arch" }
dbs-boot = { path = "src/dragonball/crates/dbs_boot" }
dbs-device = { path = "src/dragonball/crates/dbs_device" }
dbs-interrupt = { path = "src/dragonball/crates/dbs_interrupt" }
dbs-legacy-devices = { path = "src/dragonball/crates/dbs_legacy_devices" }
dbs-pci = { path = "src/dragonball/crates/dbs_pci" }
dbs-snapshot = { path = "src/dragonball/crates/dbs_snapshot" }
dbs-upcall = { path = "src/dragonball/crates/dbs_upcall" }
dbs-utils = { path = "src/dragonball/crates/dbs_utils" }
dbs-virtio-devices = { path = "src/dragonball/crates/dbs_virtio_devices" }
dragonball = { path = "src/dragonball" }

# Local dependencies from runtime-rs
agent = { path = "src/runtime-rs/crates/agent" }
ch-config = { path = "src/runtime-rs/crates/hypervisor/ch-config" }
common = { path = "src/runtime-rs/crates/runtimes/common" }
hypervisor = { path = "src/runtime-rs/crates/hypervisor" }
linux_container = { path = "src/runtime-rs/crates/runtimes/linux_container" }
persist = { path = "src/runtime-rs/crates/persist" }
resource = { path = "src/runtime-rs/crates/resource" }
runtimes = { path = "src/runtime-rs/crates/runtimes" }
service = { path = "src/runtime-rs/crates/service" }
tests_utils = { path = "src/runtime-rs/tests/utils" }
virt_container = { path = "src/runtime-rs/crates/runtimes/virt_container" }
wasm_container = { path = "src/runtime-rs/crates/runtimes/wasm_container" }

# Local dependencies from `src/lib`
kata-sys-util = { path = "src/libs/kata-sys-util" }
kata-types = { features = ["safe-path"], path = "src/libs/kata-types" }
logging = { path = "src/libs/logging" }
mem-agent = { path = "src/libs/mem-agent" }
pcilibs-rs = { git = "https://github.com/kata-containers/pcilibs-rs", rev = "d248714e" }
pod-resources-rs = { path = "src/libs/pod-resources-rs" }
protocols = { features = ["async"], path = "src/libs/protocols" }
runtime-spec = { path = "src/libs/runtime-spec" }
safe-path = { path = "src/libs/safe-path" }
shim-interface = { path = "src/libs/shim-interface" }
test-utils = { path = "src/libs/test-utils" }

# Local dependencies from `src/agent`
kata-agent-policy = { path = "src/agent/policy" }
rustjail = { path = "src/agent/rustjail" }
vsock-exporter = { path = "src/agent/vsock-exporter" }

# Outside dependencies
actix-rt = "2.7.0"
anyhow = "1.0.103"
async-recursion = "0.3.2"
async-trait = "0.1.48"
awaitgroup = "0.7.0"
base64 = "0.22"
bilge = "0.3.0"
bytes = "1.0"
capctl = "0.2.0"
cfg-if = "1.0.0"
cgroups = { features = ["oci"], package = "cgroups-rs", version = "0.5.1" }
clap = { features = ["derive"], version = "4.5.40" }
const_format = "0.2.30"
container-device-interface = "1.1.1"
containerd-shim = { features = ["async"], version = "0.11.0" }
containerd-shim-protos = { features = ["async"], version = "0.11.0" }
derivative = "2.2.0"
futures = "0.3.30"
go-flag = "0.1.0"
http-body-util = "0.1"
hyper = { features = ["client", "http1", "server"], version = "1.10.1" }
hyper-util = { features = [
  "client-legacy",
  "server-auto",
  "server-graceful",
  "tokio",
], version = "0.1" }
hyperlocal = "0.9.1"
ipnetwork = "0.17.0"
lazy_static = "1.4"
libc = "0.2.94"
log = "0.4.14"
netlink-packet-core = "0.7.0"
netlink-packet-route = "0.19.0"
netlink-sys = { features = ["tokio_socket"], version = "0.7.0" }
netns-rs = "0.1.0"
# Note: nix needs to stay sync'd with libs versions
devicemapper = { git = "https://github.com/stratis-storage/devicemapper-rs", rev = "078e70ceecf0d08eb0c800626827c9bc0a9a8adc" }
gpt = "4.1.0"
nix = { features = [
  "event",
  "feature",
  "fs",
  "hostname",
  "ioctl",
  "mman",
  "mount",
  "process",
  "reboot",
  "sched",
  "signal",
  "socket",
  "term",
  "user",
], version = "0.31.3" }
oci-spec = { features = ["runtime"], version = "0.10.0" }
opentelemetry = { features = ["rt-tokio"], version = "0.17.0" }
pathrs = "0.2.4"
procfs = "0.12.0"
prometheus = { features = ["process"], version = "0.14.0" }
protobuf = "3.7.2"
rand = "0.10.1"
regex = "1.10.5"
rstest = "0.26.1"
rtnetlink = "0.14.0"
scan_fmt = "0.2.6"
scopeguard = "1.0.0"
semver = "1.0"
serde = { features = ["derive"], version = "1.0.145" }
serde_json = "1.0.91"
serial_test = "0.10.0"
sha2 = "0.11.0"
slog = "2.5.2"
slog-scope = "4.4.0"
slog-stdlog = "4.0.0"
slog-term = "2.9.0"
strum = { features = ["derive"], version = "0.24.0" }
strum_macros = "0.26.2"
sysinfo = "0.39.5"
tar = "0.4.46"
tdx = "0.1.1"
tempfile = "3.19.1"
thiserror = "2.0.18"
tokio = "1.46.1"
tokio-util = "0.7.17"
tokio-vsock = "0.3.4"
toml = "1.1.2"
tracing = "0.1.44"
tracing-opentelemetry = "0.18.0"
tracing-subscriber = "0.3.20"
ttrpc = "0.9.0"
url = "2.5.4"
which = "4.3.0"

# Per-package release profile overrides for kata-deploy. The kata-deploy
# binary runs once at pod start and then idles waiting for SIGTERM, so we
# size-optimise it (opt-level = "z") and keep codegen-units = 1 to give
# the optimiser the whole picture. These overrides only affect the
# kata-deploy crate; agent / runtime-rs / dragonball compile with their
# usual defaults.
[profile.release.package."kata-deploy"]
codegen-units = 1
opt-level = "z"
